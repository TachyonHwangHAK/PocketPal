<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketPal · Virtual Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8FF; --bg-dot:#DAD3FF;
  --panel:#FFFFFF; --panel-2:#F5F3FF; --panel-3:#EEEAFF;
  --ink:#2A2350; --ink-soft:#6A6391; --ink-faint:#9A94BD;
  --line:#E1DCFA;
  --shell:#6B4FD8; --shell-deep:#4A34A6; --shell-hi:#8D76F2;
  --lcd:#221A4A; --lcd-ink:#F4F1FF;
  --tang:#FF8A3D; --tang-deep:#D9621A;
  --butter:#FFCF3D; --mint:#2FC48A; --pink:#FF6FA3; --sky:#3FA9F5; --red:#F0525A; --grape:#8F6BFF;
  --radius-l:28px; --radius-m:20px; --radius-s:14px;
  --font-display:'Baloo 2','ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --font-body:'Nunito','PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow-press:0 4px 0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15112B; --bg-dot:#201A42;
    --panel:#221C45; --panel-2:#2A2352; --panel-3:#322A60;
    --ink:#F2EFFF; --ink-soft:#B8B0E2; --ink-faint:#8981B8;
    --line:#3A3170;
    --shell:#5A40C6; --shell-deep:#3A2893; --shell-hi:#7B63E6;
    --lcd:#120D2B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15112B; --bg-dot:#201A42;
  --panel:#221C45; --panel-2:#2A2352; --panel-3:#322A60;
  --ink:#F2EFFF; --ink-soft:#B8B0E2; --ink-faint:#8981B8;
  --line:#3A3170;
  --shell:#5A40C6; --shell-deep:#3A2893; --shell-hi:#7B63E6;
  --lcd:#120D2B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1.6px, transparent 1.7px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
img,canvas{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app shell ---------- */
.app{max-width:1180px;margin:0 auto;padding:10px 14px 20px;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;flex:none;border-radius:13px;background:var(--shell);display:grid;place-items:center;box-shadow:inset 0 -3px 0 var(--shell-deep)}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.top-actions{display:flex;gap:8px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:var(--shadow-press) var(--line);transition:transform .08s, box-shadow .08s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.off{color:var(--ink-faint)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:920px){
  .layout{grid-template-columns:minmax(0,1.35fr) minmax(340px,400px)}
  .panel{position:sticky;top:12px}
}

/* ---------- device & screen ---------- */
.device{background:var(--shell);border-radius:var(--radius-l);padding:12px;box-shadow:inset 0 -7px 0 var(--shell-deep), inset 0 3px 0 var(--shell-hi);}
.screen{position:relative;width:100%;height:clamp(250px,46dvh,440px);border-radius:20px;overflow:hidden;background:#BFE6FF;box-shadow:inset 0 0 0 4px rgba(20,10,60,.22);touch-action:none;user-select:none;-webkit-user-select:none}
@media (min-width:920px){ .screen{height:clamp(380px,64dvh,640px)} }
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(88%,440px);background:#fff;color:#2A2350;border-radius:18px;padding:8px 14px;font-family:var(--font-display);font-weight:600;font-size:1rem;line-height:1.3;text-align:center;box-shadow:0 4px 0 rgba(30,20,80,.18);z-index:2;pointer-events:none;overflow-wrap:anywhere}
.bubble.show{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:3}
.hud-progress{flex:1;min-width:0;max-width:260px;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;color:#2A2350;font-size:.9rem}
.hud-progress .bar{flex:1;min-width:44px;height:10px;background:#E6E1FF;border-radius:999px;overflow:hidden}
.hud-progress .bar i{display:block;height:100%;width:0;background:var(--sky);border-radius:999px;transition:width .15s}
.screen-badge{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(255,255,255,.88);color:#2A2350;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.8rem;font-family:var(--font-display);pointer-events:none}

.ticker{margin-top:10px;min-height:48px;background:var(--lcd);color:var(--lcd-ink);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:1rem;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.ticker-icon{flex:none;width:28px;height:28px;display:grid;place-items:center;font-size:1.2rem}
.ticker-text{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.ticker-text.flash{animation:tickin .35s ease-out}
@keyframes tickin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;gap:12px;min-width:0;user-select:none;-webkit-user-select:none}
.dex-detail .pet-species,.section .pet-species{white-space:normal}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius-m);padding:14px}
.petinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.petinfo .avatar{grid-row:span 2;width:58px;height:58px;border-radius:18px;background:var(--panel-3);display:grid;place-items:center;overflow:hidden}
.petinfo .avatar canvas{width:58px;height:58px}
.pet-name{font-family:var(--font-display);font-weight:800;font-size:1.35rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pet-species{color:var(--ink-soft);font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.78rem;background:var(--panel-3);color:var(--ink);white-space:nowrap}
.xp{margin-top:10px}
.xp-row{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;font-weight:800;color:var(--ink-soft)}
.xp-bar{height:12px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:4px}
.xp-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--grape),var(--pink));transition:width .5s ease}
.evolve-btn{margin-top:10px;width:100%}
.evolve-btn.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--tang-deep),0 0 0 0 rgba(255,138,61,.5)}50%{box-shadow:0 4px 0 var(--tang-deep),0 0 0 8px rgba(255,138,61,0)}}

.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meter{min-width:0}
.meter-top{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.meter-top .ico{font-size:.95rem;line-height:1}
.meter-top .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meter-top .val{color:var(--ink);font-variant-numeric:tabular-nums}
.meter-bar{height:10px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:4px}
.meter-bar i{display:block;height:100%;border-radius:999px;transition:width .6s ease, background-color .4s}
.meter.low .meter-bar i{animation:lowpulse 1.1s ease-in-out infinite}
.meter.low .val{color:var(--red)}
@keyframes lowpulse{50%{opacity:.45}}

.dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:78px;padding:8px 4px;border-radius:18px;border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow-press) var(--line);font-family:var(--font-display);font-weight:700;font-size:.88rem;line-height:1.1;transition:transform .08s, box-shadow .08s, opacity .2s;text-align:center}
.dock-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.dock-btn:disabled{opacity:.42;cursor:not-allowed}
.dock-btn .disc{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff}
.dock-btn .disc svg{width:22px;height:22px}
.dock-btn .dot{position:absolute}
.dock-btn{position:relative}
.dock-btn .alert{position:absolute;top:6px;right:8px;width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--panel)}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:16px;border:0;background:var(--tang);color:#fff;font-family:var(--font-display);font-weight:800;font-size:1rem;box-shadow:var(--shadow-press) var(--tang-deep);transition:transform .08s, box-shadow .08s, opacity .2s;text-align:center;line-height:1.15}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--tang-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--panel-2);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow-press) var(--line)}
.btn.secondary:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.grape{background:var(--grape);box-shadow:var(--shadow-press) #6546D6}
.btn.danger{background:var(--red);box-shadow:var(--shadow-press) #B8323A}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:13px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 140px}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:18px;border:2px solid var(--line);background:var(--panel-2);box-shadow:var(--shadow-press) var(--line);text-align:left;min-height:108px;transition:transform .08s, box-shadow .08s}
.item:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.item:disabled{opacity:.45;cursor:not-allowed}
.item .emo{font-size:1.8rem;line-height:1}
.item .nm{font-family:var(--font-display);font-weight:800;font-size:1rem;line-height:1.15}
.item .fx{font-size:.8rem;color:var(--ink-soft);font-weight:700;line-height:1.25}

.section{margin-top:18px}
.section:first-child{margin-top:0}
.section h3{font-family:var(--font-display);font-weight:800;font-size:1.08rem;margin:0 0 8px}
.hint{color:var(--ink-soft);font-size:.9rem;margin:0 0 10px;font-weight:600}
.note{background:var(--panel-2);border-radius:14px;padding:10px 12px;font-size:.88rem;color:var(--ink-soft);font-weight:600}

.seg{display:inline-flex;background:var(--panel-3);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:11px;padding:8px 14px;font-weight:800;min-height:40px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--tang);background:color-mix(in srgb,var(--tang) 14%,var(--panel))}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:800;font-size:.9rem}
.input,textarea.input{width:100%;min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);padding:10px 12px;font-weight:700}
textarea.input{min-height:84px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;word-break:break-all}
.input:focus{outline:none;border-color:var(--tang)}

.switch-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .sw-label{flex:1;font-weight:800;min-width:0}
.switch{position:relative;width:54px;height:32px;flex:none;border-radius:999px;border:0;background:var(--panel-3);transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
input[type=range]{width:120px;accent-color:var(--tang);flex:none}
@media (max-width:420px){ input[type=range]{width:90px} }

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,12,48,.5);z-index:40;opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(680px,100%);max-height:88dvh;display:flex;flex-direction:column;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(20,10,60,.3);transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:translate(-50%,0)}
@media (min-width:760px){
  .sheet{top:50%;bottom:auto;border-radius:26px;max-height:86dvh;transform:translate(-50%,-44%) scale(.96);opacity:0;transition:transform .25s cubic-bezier(.2,.9,.3,1),opacity .2s}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px 20px;border-bottom:2px solid var(--line);flex:none}
.sheet-head h2{flex:1;margin:0;font-family:var(--font-display);font-weight:800;font-size:1.3rem;line-height:1.2;min-width:0}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:16px 20px 22px;flex:1;min-height:0}

/* ---------- start screen ---------- */
.start{position:fixed;inset:0;z-index:60;background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.6px, transparent 1.7px);background-size:22px 22px;overflow-y:auto;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.start-inner{max-width:680px;margin:0 auto;padding:28px 0 40px;display:flex;flex-direction:column;gap:16px}
.start-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.start-hero canvas{width:200px;height:170px}
.start-title{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1;margin:0;color:var(--shell)}
:root[data-theme="dark"] .start-title{color:#B9A8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .start-title{color:#B9A8FF}}
.start-sub{margin:0;color:var(--ink-soft);font-weight:700}
.egg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.egg-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;border-radius:18px;border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow-press) var(--line);font-weight:800;font-size:.85rem}
.egg-opt canvas{width:64px;height:64px}
.egg-opt[aria-pressed="true"]{border-color:var(--tang);background:color-mix(in srgb,var(--tang) 12%,var(--panel));box-shadow:var(--shadow-press) var(--tang-deep)}
.egg-opt small{color:var(--ink-soft);font-weight:700;font-size:.72rem}

/* ---------- evolution / dex ---------- */
.lineage{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;align-items:center}
.lin-node{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;text-align:center;font-size:.72rem;font-weight:800;color:var(--ink-soft)}
.lin-node canvas{width:62px;height:62px;border-radius:16px;background:var(--panel-2)}
.lin-node.cur canvas{box-shadow:0 0 0 3px var(--tang)}
.lin-node span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin-arrow{flex:none;color:var(--ink-faint);font-weight:800}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.branch{border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--panel-2);min-width:0}
.branch.pred{border-color:var(--tang);background:color-mix(in srgb,var(--tang) 10%,var(--panel))}
.branch canvas{width:56px;height:56px;flex:none}
.branch .b-name{font-family:var(--font-display);font-weight:800;line-height:1.1;font-size:.95rem;overflow:hidden;text-overflow:ellipsis}
.branch .b-req{font-size:.76rem;font-weight:700;color:var(--ink-soft);line-height:1.25}
.traits{display:grid;gap:8px}
.trait{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-weight:800;font-size:.85rem}
.trait .tb{height:10px;border-radius:999px;background:var(--panel-3);overflow:hidden}
.trait .tb i{display:block;height:100%;border-radius:999px}
.trait .tv{text-align:right;font-variant-numeric:tabular-nums}
.skills{display:flex;flex-direction:column;gap:6px}
.skill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel-2);font-weight:700;font-size:.9rem}
.skill b{font-family:var(--font-display);font-weight:800;color:var(--ink-soft);min-width:66px;font-size:.8rem}
.skill.locked{opacity:.55}
.dex-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dex-count{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.elem-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px}
.elem-tabs .chip{flex:none}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.dex-cell{border:0;background:var(--panel-2);border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.dex-cell canvas{width:54px;height:54px}
.dex-cell span{font-size:.62rem;font-weight:800;color:var(--ink-soft);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.dex-cell.seen{background:var(--panel-3)}
.dex-stage-label{grid-column:1/-1;font-family:var(--font-display);font-weight:800;font-size:.9rem;margin-top:8px;color:var(--ink-soft)}
.dex-detail{display:flex;gap:12px;align-items:center;margin-top:10px}
.dex-detail canvas{width:84px;height:84px;flex:none;background:var(--panel-2);border-radius:18px}
.matchups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.matchup{font-size:.82rem;font-weight:700;background:var(--panel-2);border-radius:12px;padding:6px 10px}

/* ---------- games ---------- */
.mini-stage{width:100%;height:150px;border-radius:18px;background:linear-gradient(#CFEAFF,#EAF7FF);display:block}
.timing{position:relative;height:56px;border-radius:16px;background:var(--panel-3);margin:14px 0;overflow:hidden;touch-action:manipulation;cursor:pointer}
.timing .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--mint) 45%,transparent)}
.timing .zone.perfect{background:color-mix(in srgb,var(--butter) 80%,transparent)}
.timing .marker{position:absolute;top:6px;bottom:6px;width:8px;margin-left:-4px;border-radius:6px;background:var(--ink);box-shadow:0 0 0 3px var(--panel)}
.round-dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.round-dots i{width:14px;height:14px;border-radius:50%;background:var(--panel-3)}
.round-dots i.p{background:var(--butter)} .round-dots i.g{background:var(--mint)} .round-dots i.m{background:var(--red)}
.result-line{text-align:center;font-family:var(--font-display);font-weight:800;font-size:1.1rem;min-height:1.6em}
.cups{position:relative;height:150px;margin:16px 0}
.cup{position:absolute;bottom:14px;width:30%;max-width:110px;height:104px;border:0;padding:0;background:transparent;transition:transform .32s cubic-bezier(.4,.1,.3,1)}
.cup svg{width:100%;height:100%;transition:transform .35s ease}
.cup.lift svg{transform:translateY(-44px)}
.cup:disabled{cursor:default}
.treat{position:absolute;bottom:16px;width:30%;max-width:110px;text-align:center;font-size:2rem;transition:transform .32s cubic-bezier(.4,.1,.3,1);pointer-events:none}

/* ---------- friends ---------- */
.qr-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr-box{width:196px;height:196px;flex:none;background:#fff;border-radius:18px;padding:10px;display:grid;place-items:center;border:2px solid var(--line)}
.qr-box canvas{width:176px;height:176px;image-rendering:pixelated}
.qr-side{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:10px}
.friend-list{display:flex;flex-direction:column;gap:8px}
.friend{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:var(--panel-2);min-width:0}
.friend canvas{width:52px;height:52px;flex:none;border-radius:14px;background:var(--panel-3)}
.friend .f-main{flex:1;min-width:0}
.friend .f-name{font-family:var(--font-display);font-weight:800;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friend .f-sub{font-size:.78rem;font-weight:700;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friend .f-act{display:flex;gap:6px;flex:none}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 30%,transparent)}
.cam{width:100%;max-height:260px;border-radius:16px;background:#000;object-fit:cover}
.play-stage{width:100%;height:190px;border-radius:18px;display:block;background:linear-gradient(#FFE3F0,#FFF6E0)}
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:4px}
.msg{max-width:84%;padding:8px 12px;border-radius:16px;font-weight:700;font-size:.93rem;line-height:1.35;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--tang);color:#fff;border-bottom-right-radius:6px}
.msg.pet{align-self:flex-start;background:var(--panel-3);border-bottom-left-radius:6px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input .input{flex:1}


/* ---------- v2: dock, drills, clinic, battle ---------- */
.dock{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dock-btn{min-height:74px;font-size:.8rem;padding:8px 2px}
.dock-btn .disc{width:34px;height:34px;border-radius:12px}
.dock-btn .disc svg{width:20px;height:20px}
@media (max-width:380px){.dock-btn{min-height:66px;font-size:.72rem}.dock-btn .disc{width:30px;height:30px;border-radius:10px}.dock-btn .disc svg{width:18px;height:18px}}
.btn{touch-action:manipulation}
.pick3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.pick3.two{grid-template-columns:1fr 1fr}
.pick3 .btn{width:100%;padding-left:4px;padding-right:4px}
.game-cv{width:100%;height:210px;border-radius:18px;display:block;touch-action:none;background:var(--panel-2)}
.game-cv.tall{height:260px}
.drill-hud{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:800;margin-bottom:8px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.big-tap{min-height:58px;font-size:1.15rem}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto;max-width:320px}
.pad{aspect-ratio:1.6;border:0;border-radius:22px;background:color-mix(in srgb,var(--pad) 50%,var(--panel));font-size:2rem;box-shadow:0 5px 0 color-mix(in srgb,var(--pad) 70%,#000);transition:transform .08s,filter .08s,background .1s;touch-action:manipulation}
.pad.lit{background:var(--pad);filter:brightness(1.2);transform:scale(1.05);box-shadow:0 0 0 5px color-mix(in srgb,var(--pad) 40%,transparent),0 5px 0 color-mix(in srgb,var(--pad) 70%,#000)}
.pad:disabled{cursor:default}
.item.recommended{border-color:var(--mint);box-shadow:0 4px 0 var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--panel))}
.clinic-status{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;background:var(--panel-2)}
.clinic-status.ill{background:color-mix(in srgb,#FF6F7F 14%,var(--panel))}
.clinic-emo{font-size:2.6rem;line-height:1;flex:none}
.battle{position:fixed;inset:0;z-index:55;background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.7px);background-size:22px 22px;overflow-y:auto;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.battle-wrap{max-width:760px;margin:0 auto;padding:12px 0 20px;display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bhead h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:1.5rem}
.bcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.bcard.foe{border-color:color-mix(in srgb,#E0467C 45%,var(--line))}
.bc-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;min-width:0}
.bc-name{font-family:var(--font-display);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bc-lv{font-size:.72rem;font-weight:800;color:var(--ink-soft);white-space:nowrap;flex:none}
.bc-hp{height:12px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:6px}
.bc-hp i{display:block;height:100%;border-radius:999px;transition:width .5s ease,background-color .3s}
.bc-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:6px}
.bc-num{font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.bc-sp{display:flex;gap:5px;padding-right:3px}
.bc-sp i{width:10px;height:10px;border-radius:3px;background:var(--panel-3);transform:rotate(45deg)}
.bc-sp i.on{background:var(--butter);box-shadow:0 0 6px var(--butter)}
.bc-status{display:flex;flex-wrap:wrap;gap:4px;min-height:22px;margin-top:4px;font-size:.85rem}
.barena{position:relative;height:clamp(200px,36dvh,360px);border-radius:20px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(20,10,60,.15);flex:none}
.barena canvas{position:absolute;inset:0;width:100%;height:100%}
.blog{min-height:52px;background:var(--lcd);color:var(--lcd-ink);border-radius:14px;padding:10px 14px;font-family:var(--font-display);font-weight:600;display:flex;align-items:center;line-height:1.3}
.blog.flash{animation:tickin .3s ease-out}
.bmoves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bmove{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow-press) var(--line);min-height:62px;transition:transform .08s,box-shadow .08s,opacity .2s;touch-action:manipulation;min-width:0}
.bmove:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.bmove:disabled{opacity:.45;cursor:not-allowed}
.bmove.ult{border-color:var(--butter);background:color-mix(in srgb,var(--butter) 16%,var(--panel))}
.bmove.mythic{background:linear-gradient(100deg,#FFF3C4,#FFD9F1,#D6ECFF);color:#3A2A00}
.bm-name{font-family:var(--font-display);font-weight:800;font-size:.95rem;line-height:1.15;overflow-wrap:anywhere}
.bm-sub{font-size:.75rem;font-weight:700;color:var(--ink-soft)}
.bmove.mythic .bm-sub{color:#6B4A00}
.bresult{text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.bresult-title{font-family:var(--font-display);font-weight:800;font-size:1.8rem}
.bresult.win .bresult-title{color:var(--tang)}
.bresult.lose .bresult-title{color:var(--ink-soft)}
.bresult .row{justify-content:center}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (max-width:380px){

    case 'spear': case 'ring': case 'lotus': Object.assign(f, { body: pickOf([0, 2, 1]), ears: 0, tail: 0, pattern: pickOf([0, 1]) }); break;
    case 'tank': Object.assign(f, { body: pickOf([3, 0]), ears: 0, tail: 0, pattern: 0, eyes: r() < 0.5 ? 0 : 2 }); break;

      const d = Math.hypot(p.x - pt.lastX, p.y - pt.lastY); pt.lastX = p.x; pt.lastY = p.y;
      if (!this.onPet(p.x, p.y)) return;
      if (this.bath) {
        Game.scrub(d);
        if (Math.random() < 0.5) Particles.add('bubble', p.x + rand(-10, 10), p.y + rand(-10, 10), { vy: rand(-40, -15), size: rand(4, 11) * this.scale, max: 1.6 });
        return;
      }
      if (S.pet.sleeping) return;
      pt.stroke += d;
      if (pt.stroke > 150) { pt.stroke = 0; pt.movedOnPet = true; Game.stroke(p.x, p.y); }
    });
    const end = () => { pt.down = false; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', () => { pt.hover = false; });
  },
  pointerTap(x, y) {
    const pet = S.pet;
    if (pet.stage === 0) { if (Math.abs(x - this.pet.x) < 70 * this.scale && y > this.floorY - 130 * this.scale) Game.tapEgg(); return; }
    // poops first
    for (let i = 0; i < pet.poops.length; i++) {
      const px = pet.poops[i] * this.W, py = this.floorY - 10 * this.scale;
      if (Math.hypot(x - px, y - py) < 26 * this.scale) { Game.cleanPoop(i); return; }
    }
    if (this.bath) return;
    if (this.onPet(x, y)) {
      if (isFainted(pet)) { UI.tick(t('ail.faintedHint'), '🏥'); Sound.play('sad'); return; }
      Game.petTap(x, y);
    }
  },
};

/* =========================================================
   Game logic
   ========================================================= */
const Game = {
  lastTick: 0, needCool: 0, chatterCool: 40, logicTimer: null, dizzyUntil: 0, strokeBudget: 0,
  start() {
    this.lastTick = nowMs();
    clearInterval(this.logicTimer);
    this.logicTimer = setInterval(() => this.tick(), 1000);
  },
  offline(elapsedSec) {
    const pet = S.pet;
    if (!pet || pet.stage === 0 || elapsedSec < 60 || isFainted(pet) || (S.cheats && S.cheats.god)) return;
    const secs = Math.min(elapsedSec, 12 * 3600);
    const k = 0.35;
    const st = pet.stats;
    const floor = (v) => Math.max(10, v);
    if (pet.sleeping) {
      st.energy = clamp(st.energy + secs * (5 / 60) * k, 0, 100);
      if (st.energy >= 100) pet.sleeping = false;
    } else st.energy = floor(st.energy - secs * (0.6 / 60) * k);
    st.hunger = floor(st.hunger - secs * (1.0 / 60) * k);
    st.thirst = floor(st.thirst - secs * (1.3 / 60) * k);
    st.hygiene = floor(st.hygiene - secs * (0.45 / 60) * k);
    st.mood = floor(st.mood - secs * (0.6 / 60) * k);
    if (pet.digest > 0 && pet.poops.length < 4) { pet.poops.push(rand(0.12, 0.88)); pet.digest = 0; }
    pet.age += secs;
  },
  tick() {
    if (!this.lastTick) return;
    const now = nowMs();
    let dt = (now - this.lastTick) / 1000; this.lastTick = now;
    if (!S || !S.pet || S.pet.stage === 0 || Stage.evo) return;
    if (dt > 10) { this.offline(dt); dt = 1; }
    dt = clamp(dt, 0, 2) * gameSpeed();
    const pet = S.pet, st = pet.stats;
    const god = !!(S.cheats && S.cheats.god);
    const prev = Object.assign({}, st);
    Events.tick(dt);
    if (isFainted(pet)) { pet.sleeping = false; UI.refreshStats(); saveSoon(); return; }
    const sl = pet.sleeping;
    pet.age += dt;
    st.hunger -= (sl ? 0.4 : 1.0) / 60 * dt;
    st.thirst -= (sl ? 0.5 : 1.3) / 60 * dt;
    st.energy += (sl ? 5 : -0.6) / 60 * dt;
    st.hygiene -= (0.45 + 0.35 * pet.poops.length) / 60 * dt;
    st.mood -= ((sl ? 0.2 : 0.6) + (st.hunger < 25 ? 0.8 : 0) + (st.thirst < 25 ? 0.6 : 0) + (st.hygiene < 25 ? 0.6 : 0)) / 60 * dt;
    const A = pet.ailment ? AILMENTS[pet.ailment.id] : null;
    if (A) {
      pet.ailment.t = (pet.ailment.t || 0) + dt;
      for (const k in A.drain) st[k] -= A.drain[k] / 60 * dt;
      st.health -= A.hp / 60 * dt;
    }
    const crit = (st.hunger < 15) + (st.thirst < 15) + (st.hygiene < 15);
    if (crit) st.health -= 0.8 * crit / 60 * dt;
    else if (!A && st.hunger > 50 && st.thirst > 50 && st.hygiene > 50) st.health += 0.6 / 60 * dt;
    if (god) STAT_KEYS.forEach((k) => { st[k] = Math.max(st[k], prev[k]); });
    STAT_KEYS.forEach((k) => { st[k] = clamp(st[k], 0, 100); });
    if (st.health <= 0 && !god) { st.health = 0; Health.faint(); UI.refresh(); saveSoon(); return; }
    if (!sl && st.energy < 5) { pet.sleeping = true; UI.tick(t('tick.sleep', { n: pet.name }), '🌙'); Sound.play('snore'); UI.refresh(); }
    else if (sl && st.energy >= 100) { pet.sleeping = false; UI.tick(t('tick.wake', { n: pet.name }), '☀️'); this.say('wake'); UI.refresh(); }
    if (pet.digest > 0 && !sl) {
      pet.digest -= dt;
      if (pet.digest <= 0) {
        pet.digest = 0;
        if (pet.poops.length < 4) {
          let x = clamp(Stage.pet.x / Stage.W + (Math.random() < 0.5 ? -0.14 : 0.14), 0.1, 0.9);
          pet.poops.push(x); Sound.play('pop'); UI.tick(t('tick.poop'), '💩'); UI.refreshDockAlerts();
        }
      }
    }
    if (!sl) {
      pet.passive += dt;
      if (pet.passive >= 60) { pet.passive = 0; const avg = STAT_KEYS.reduce((a, k) => a + st[k], 0) / 6; if (avg >= 55 && !pet.ailment) this.addXp(2); }
    }
    // needs & chatter
    this.needCool -= dt; this.chatterCool -= dt;
    if (!sl && this.needCool <= 0 && !UI.sheetOpen && !Battle.active && !Stage.bath && !Stage.ball && !Events.active) {
      if (pet.ailment && Math.random() < 0.5) { this.say(pet.ailment.id === 'injury' ? 'hurt' : 'sick'); this.needCool = 45; }
      else {
      const needs = [['hunger', 'hungry'], ['thirst', 'thirsty'], ['energy', 'tired'], ['hygiene', 'dirty']].filter(([k]) => st[k] < 25).sort((a, b) => st[a[0]] - st[b[0]]);
      if (needs.length) { this.say(needs[0][1]); Sound.play('notify'); this.needCool = 45; this.chatterCool = Math.max(this.chatterCool, 30); }
      else this.needCool = 10;
      }
    }
    if (!sl && this.chatterCool <= 0 && !UI.sheetOpen && !Battle.active && !Stage.bath && !Stage.ball && !Events.active && !pet.ailment && st.mood > 50) { this.say('talk'); this.chatterCool = rand(70, 120); }
    UI.refreshStats();
    saveSoon();
  },
  say(kind, text) {
    const lines = VOICE[LANG][kind];
    const line = text || (lines ? pick(lines) : '');
    if (!line) return;
    UI.bubble(line);
    const sp = curSpecies();
    Sound.speak(line, sp ? sp.stage : 1);
  },
  fx(fx) { const st = S.pet.stats; for (const k in fx) if (k in st) st[k] = clamp(st[k] + fx[k], 0, 100); },
  traits(tr) { const p = S.pet; for (const k in tr) { p.traits[k] += tr[k]; p.life[k] += tr[k]; } },
  addXp(n) {
    const p = S.pet;
    if (!p || p.stage === 0 || p.stage >= 6) return;
    n = Math.max(1, Math.round(n * gameSpeed()));
    p.xp = Math.min(XP_NEED[p.stage], p.xp + n);
    Particles.add('text', Stage.petCenter().x, Stage.petCenter().y - Stage.petR() * 1.3, { text: '+' + n, size: 16, vy: -36, max: 1.1, color: '#FFE36B' });
    if (this.canEvolve() && !p.readyNotified) { p.readyNotified = true; Sound.play('notify'); UI.tick(t('evo.ready'), '✨'); }
    UI.refresh();
  },
  canEvolve() { const p = S.pet; return p && p.stage >= 1 && p.stage <= 5 && p.xp >= XP_NEED[p.stage] && p.stats.health >= 40 && !p.ailment && !p.sleeping && !Stage.evo && !Battle.active; },
  busy() {
    const p = S.pet;
    if (!p || p.stage === 0 || Stage.evo) return true;
    if (isFainted(p)) { UI.tick(t('ail.faintedHint'), '🏥'); Sound.play('sad'); return true; }
    if (p.sleeping) { UI.tick(t('tick.sleeping'), '🌙'); Sound.play('snore'); return true; }
    if (Stage.bath) Game.bathFinish(true);
    return false;
  },
  predictBranch() {
    const p = S.pet, tr = p.traits;
    if (p.stage <= 3) { const arr = [tr.str, tr.int, tr.hrt]; const m = Math.max(...arr); return m === 0 ? 2 : arr.indexOf(m); }
    return tr.str > Math.max(tr.int, tr.hrt) ? 0 : 1;
  },
  /* ----- actions ----- */
  tapEgg() {
    const p = S.pet;
    if (p.stage !== 0 || Stage.evo) return;
    p.hatchTaps++; Stage.pet.wobble = 1; Sound.play('crack');
    Particles.burst('sparkle', Stage.pet.x, Stage.floorY - 60 * Stage.scale, 3, 80 * Stage.scale, { size: 5, max: 0.7 });
    UI.tick(t('tick.hatching'), '🥚');
    if (p.hatchTaps >= 6) this.hatch();
    saveSoon();
  },
  hatch() {
    const p = S.pet;
    const to = SPECIES.get(spId(p.e, [], p.clan));
    Stage.startEvo(null, to, 'hatch', () => {
      p.stage = 1; p.path = []; p.xp = 0; p.hatchTaps = 0;
      S.dex[to.id] = 1;
      UI.tick(t('tick.hatch', { n: p.name }), '🐣');
      setTimeout(() => this.say('hatch'), 500);
      UI.refresh(); saveNow(); Net.updatePresence();
    });
  },
  evolve() {
    if (!this.canEvolve()) return;
    UI.closeSheet();
    const p = S.pet, from = curSpecies(), b = this.predictBranch();
    const to = SPECIES.get(spId(p.e, p.path.concat(b), p.clan));
    if (!to) return;
    Stage.startEvo(from, to, 'evolve', () => {
      p.path = p.path.concat(b); p.stage = to.stage; p.xp = 0; p.readyNotified = false;
      p.traits = { str: 0, int: 0, hrt: 0 };
      this.fx({ mood: 20, health: 10, energy: 10 });
      S.dex[to.id] = 1;
      UI.tick(t('tick.evolve', { a: spName(from), b: spName(to) }), '✨');
      setTimeout(() => this.say('evolve'), 600);
      UI.refresh(); saveNow(); Net.updatePresence();
    });
    UI.refresh();
  },
  rebirth() {
    const old = S.pet;
    const np = newPet(old.e, old.name, old.clan);
    np.custom = Object.assign({}, old.custom); np.id = old.id;
    S.pet = np; Stage.evo = null; Stage.ball = null; Stage.bath = false; UI.hud(null);
    UI.closeSheet(); UI.tick(t('tick.rebirth'), '🥚'); Sound.play('friend');
    UI.refresh(); saveNow(); Net.updatePresence();
  },
  feed(id) {
    if (this.busy()) return;
    const food = FOODS.find((f) => f.id === id); if (!food) return;
    const p = S.pet;
    if (p.stats.hunger >= 97) { this.say('full'); UI.tick(t('tick.full'), '🙅'); Stage.react('sad', 1.2); Sound.play('sad'); return; }
    this.fx(food.fx); this.traits(food.tr);
    Stage.holdItem(food.emo, 1.8); Stage.react('eat', 1.8); Sound.play('eat');
    const pc = Stage.petCenter();
    setTimeout(() => Particles.burst('crumb', pc.x, pc.y, 6, 70 * Stage.scale, { g: 400, size: 2.5, max: 0.9 }), 400);
    if (p.digest <= 0) p.digest = rand(70, 140);
    UI.tick(t('tick.ate', { f: t('food.' + id) }), food.emo);
    setTimeout(() => this.say('eat'), 1300);
    this.addXp(3); UI.refresh(); saveSoon();
  },
  drink(id) {
    if (this.busy()) return;
    const d = DRINKS.find((f) => f.id === id); if (!d) return;
    const p = S.pet;
    if (p.stats.thirst >= 97) { this.say('notThirsty'); UI.tick(t('tick.notThirsty'), '🙅'); Stage.react('sad', 1.2); return; }
    this.fx(d.fx); this.traits(d.tr);
    Stage.holdItem(d.emo, 1.6); Stage.react('drink', 1.6); Sound.play('drink');
    UI.tick(t('tick.drank', { f: t('drink.' + id) }), d.emo);
    setTimeout(() => this.say('drink'), 1200);
    this.addXp(2); UI.refresh(); saveSoon();
  },
  petTap(x, y) {
    const p = S.pet;
    if (p.sleeping) {
      if (p.stats.energy > 35) { p.sleeping = false; Stage.react('surprised', 1); this.say('wake'); UI.tick(t('tick.wake', { n: p.name }), '☀️'); UI.refresh(); }
      else { this.say('grumpy'); Sound.play('snore'); }
      return;
    }
    const now = performance.now();
    Stage.taps = Stage.taps.filter((x0) => now - x0 < 2500); Stage.taps.push(now);
    if (Stage.taps.length >= 8) {
      Stage.taps = []; Stage.react('dizzy', 2.4); Sound.play('dizzy'); this.say('dizzy'); UI.tick(t('tick.dizzy'), '💫');
      this.fx({ mood: -3 }); return;
    }
    Stage.squish(3.2); Stage.hop(150); Stage.react('happy', 0.9);
    Sound.chirp(curSpecies().stage, 2, 'happy'); Sound.play('heart');
    Particles.add('heart', x, y - 10, { vy: -50, size: 9, max: 1.1 });
    if (Stage.taps.length === 1) { this.fx({ mood: 2 }); }
    UI.refreshStats();
  },
  stroke(x, y) {
    const now = performance.now();
    if (now - this.strokeBudget < 350) return;
    this.strokeBudget = now;
    Stage.react('happy', 1.2); Stage.squish(1.4);
    Particles.add('heart', x, y - 12, { vy: -55, vx: rand(-20, 20), size: 8 + Math.random() * 4, max: 1.2 });
    Sound.play('heart');
    this.fx({ mood: 2 });
    this.pettedCount = (this.pettedCount || 0) + 1;
    if (this.pettedCount % 6 === 0) { this.traits({ hrt: 1 }); this.addXp(1); UI.tick(t('tick.petted'), '💗'); this.say('petted'); }
    UI.refreshStats(); saveSoon();
  },
  cuddle() {
    if (this.busy()) return;
    const pc = Stage.petCenter();
    Stage.react('happy', 1.8); Stage.hop(200); Sound.play('happy');
    for (let i = 0; i < 6; i++) setTimeout(() => Particles.add('heart', pc.x + rand(-40, 40) * Stage.scale, pc.y, { vy: -60, size: 8 + Math.random() * 5, max: 1.4 }), i * 90);
    this.fx({ mood: 8 }); this.traits({ hrt: 2 }); this.addXp(3);
    this.say('petted'); UI.tick(t('tick.petted').replace('1', '2'), '🤗'); saveSoon();
  },
  talk() {
    if (this.busy()) return;
    const p = S.pet, st = p.stats;
    let kind = 'talk';
    if (p.ailment) kind = p.ailment.id === 'injury' ? 'hurt' : 'sick'; else if (st.hunger < 30) kind = 'hungry'; else if (st.thirst < 30) kind = 'thirsty'; else if (st.energy < 25) kind = 'tired'; else if (st.hygiene < 30) kind = 'dirty';
    this.say(kind); Stage.react(kind === 'talk' ? 'happy' : 'sad', 1.2);
    Particles.add('note', Stage.petCenter().x + 20, Stage.petCenter().y - 30, { vy: -40, size: 18, max: 1.3 });

  },
  ballStart() {

  },
  ballDone(kicks) {

    this.addXp(2 + kicks); UI.tick(t('tick.ballDone', { s }), '⚽'); this.say('ball'); saveSoon();
  },
  canTrain() { const st = S.pet.stats; return st.energy >= 15 && st.hunger >= 15 && st.thirst >= 15 && !S.pet.ailment && !S.pet.sleeping; },
  trainResult(perfect, good) {
    const s = perfect * 3 + good + 1, x = 4 + perfect * 3 + good * 2;

  },
  cupsResult(found) {

    return x;
  },
  bathStart() {
    if (this.busy()) return;

    UI.hud(t('bathLabel'), 0, true); Sound.play('splash'); this.say('bath');
  },
  scrub(d) {
    const p = S.pet;
    p.bathProg = clamp((p.bathProg || 0) + d / 1400, 0, 1);
    if (Math.random() < 0.18) Sound.play('bubble');
    UI.hud(t('bathLabel'), p.bathProg);
    if (p.bathProg >= 1) this.bathFinish(false);
  },
  bathFinish(silent) {
    if (!Stage.bath) return;
    Stage.bath = false;
    const p = S.pet, prog = p.bathProg || 0;
    UI.hud(null);
    if (prog < 0.05) return;
    const pc = Stage.petCenter();
    for (let i = 0; i < 16; i++) Particles.add('drop', pc.x + rand(-60, 60) * Stage.scale, pc.y - 90 * Stage.scale, { vy: rand(120, 200), g: 300, size: 5, max: 0.9 });
    Particles.burst('sparkle', pc.x, pc.y, 10, 120 * Stage.scale, { size: 6, max: 1 });
    this.fx({ hygiene: Math.round(prog * 100), mood: Math.round(prog * 8) });
    if (prog >= 1) { this.traits({ hrt: 2 }); UI.tick(t('tick.bathDone'), '🛁'); }
    Sound.play('splash'); Sound.play('happy'); Stage.react('happy', 1.5);
    if (!silent) this.say('clean');
    this.addXp(Math.round(2 + prog * 3)); saveSoon();
  },
  cleanPoop(i) {
    const p = S.pet;
    if (i == null) {
      if (!p.poops.length) { UI.tick(t('care.nothing'), '✨'); return; }
      p.poops.forEach((x) => Particles.add('poof', x * Stage.W, Stage.floorY - 10, { size: 14, vy: 0, max: 0.6 }));
      p.poops = [];
    } else {
      const x = p.poops[i]; p.poops.splice(i, 1);

    UI.tick(t('tick.clean'), '🧹'); UI.refreshDockAlerts(); saveSoon();
  },
  brush() {
    if (this.busy()) return;
    this.fx({ hygiene: 12 }); this.traits({ hrt: 1 }); Sound.play('sweep');
    const pc = Stage.petCenter();
    Particles.burst('bubble', pc.x, pc.y, 6, 50 * Stage.scale, { size: 5, max: 1 });
    Particles.burst('sparkle', pc.x, pc.y, 4, 60 * Stage.scale, { size: 5, max: 0.8 });

  },
  toggleSleep() {
    const p = S.pet;
    if (!p || p.stage === 0) return;
    if (isFainted(p)) { UI.tick(t('ail.faintedHint'), '🏥'); return; }
    if (Stage.bath) this.bathFinish(true);
    Stage.ball = null; UI.hud(null);
    p.sleeping = !p.sleeping;
    if (p.sleeping) { this.say('sleep'); UI.tick(t('tick.sleep', { n: p.name }), '🌙'); Sound.play('snore'); }
    else { this.say('wake'); UI.tick(t('tick.wake', { n: p.name }), '☀️'); }
    UI.refresh(); saveSoon();
  },
  /** Playdate with a friend's card. kind: play|spar|gift. Returns a result object for the UI. */
  playdate(card, kind) {
    const p = S.pet;
    if (p.stats.energy < 10 || p.sleeping || isFainted(p)) return { text: t('pd.tired'), win: null };
    const key = card.i;
    const cool = S.pdCool[key] || 0;
    const onCool = nowMs() - cool < 3 * 60 * 1000;
    let text = '', win = null;
    const fs = SPECIES.get(card.s);
    if (kind === 'play') { this.fx({ mood: 12, energy: -6 }); this.traits({ hrt: 1 }); text = t('pd.played'); Sound.play('happy'); }
    else if (kind === 'gift') { this.fx({ mood: 8, hunger: 5 }); this.traits({ hrt: 3 }); text = t('pd.gifted'); Sound.play('heart'); }
    else {
      const mySp = curSpecies();
      let my = petPower(p) + rand(0, 30), their = card.pw + rand(0, 30);
      let adv = false;
      if (BEATS[mySp.e] && BEATS[mySp.e].includes(fs.e)) { my *= 1.25; adv = true; }
      if (BEATS[fs.e] && BEATS[fs.e].includes(mySp.e)) their *= 1.25;
      if (ATTR_BEATS[mySp.attr] === fs.attr) my *= 1.1;
      if (ATTR_BEATS[fs.attr] === mySp.attr) their *= 1.1;
      win = my >= their;
      this.fx({ energy: -10, hunger: -4, thirst: -5, mood: win ? 8 : 2 }); this.traits({ str: win ? 3 : 2 });
      const x = onCool ? 0 : win ? 12 : 7;
      text = (adv ? t('pd.adv') + ' ' : '') + (win ? t('pd.win', { x }) : t('pd.lose', { n: card.n, x }));
      Sound.play(win ? 'perfect' : 'sad');
      this.say(win ? 'win' : 'lose');
      if (x) this.addXp(x);
    }
    if (kind !== 'spar') {
      if (!onCool) this.addXp(6);
      if (Math.random() < 0.6) this.say('friend');
    }
    if (onCool) text += ' ' + t('pd.cool', { m: Math.max(1, Math.ceil((3 * 60 * 1000 - (nowMs() - cool)) / 60000)) });
    else S.pdCool[key] = nowMs();
    UI.refresh(); saveSoon();
    return { text, win };
  },
};

  const parts = [];
  for (const k in fx) parts.push(`${t('fx.' + k)} ${fx[k] > 0 ? '+' : ''}${fx[k]}`);
  for (const k in tr || {}) parts.push(`${t('fx.' + k)} +${tr[k]}`);
  return parts.join(' · ');
}

    try {
      const ta = h('textarea', { style: 'position:fixed;top:-100px;opacity:0' }); ta.value = text; document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;

  };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => fallback());

}
const scriptCache = {};
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve(true);
  if (scriptCache[src]) return scriptCache[src];
  scriptCache[src] = new Promise((res) => {
    const s = document.createElement('script');
    const to = setTimeout(() => res(false), 9000);
    s.src = src; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => { clearTimeout(to); res(!!window[globalName]); };
    s.onerror = () => { clearTimeout(to); delete scriptCache[src]; res(false); };
    document.head.append(s);
  });
  return scriptCache[src];
}

function addFriend(card) {
  if (S.pet && card.i === S.pet.id) return t('friends.self');
  const idx = S.friends.findIndex((f) => f.i === card.i);
  if (idx >= 0) { S.friends[idx] = card; saveSoon(); Sound.play('good'); return t('friends.updated', { n: card.n }); }
  S.friends.unshift(card); S.friends = S.friends.slice(0, 40);
  Sound.play('friend'); Game.say('friend'); Game.fx({ mood: 6 }); Game.traits({ hrt: 1 });
  UI.tick(t('friends.added', { n: card.n }), '🤝'); saveSoon();
  return t('friends.added', { n: card.n });
}
function applyTheme() {
  const th = S.settings.theme;
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
}

const Cheats = {
  CODES: ['LEGENDARY', 'RAINBOW', 'MAXPOWER', 'EVOLVENOW', 'ALLDEX', 'HEALALL', 'GODMODE', 'SUPERSKILL', 'TURBO'],
  apply(raw) {
    const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!this.CODES.includes(code)) { Sound.play('miss'); return { ok: false, text: t('cheat.bad') }; }
    const C = S.cheats, p = S.pet;
    if (!C.unlocked.includes(code)) C.unlocked.push(code);

      case 7: if (Math.random() < chance + 0.2) { const v = Math.round(u.maxHp * 0.1); u.hp = Math.min(u.maxHp, u.hp + v); this.log(t('b.eff.light', { n: u.name, v })); } else return; break;

  impact(tg, m, crit) {

  frame(ts) {

  },

   Health: ailments, fainting (pets never die) and cures
   ========================================================= */

  tummy:   { emo: '🤢', drain: { hunger: 1.0, mood: 0.6 }, hp: 0.35, cure: 'herbs' },
  fever:   { emo: '🤒', drain: { energy: 1.0, thirst: 1.2 }, hp: 0.45, cure: 'patch' },
  virus:   { emo: '🦠', drain: { hunger: 0.4, thirst: 0.4, energy: 0.4, mood: 0.8, hygiene: 0.4 }, hp: 0.6, cure: 'antivirus' },
  injury:  { emo: '🩹', drain: { mood: 0.4 }, hp: 0.25, cure: 'bandage' },
  fainted: { emo: '💫', drain: {}, hp: 0, cure: 'revive' },

const CURES = [
  { id: 'coldmed', emo: '💊' }, { id: 'herbs', emo: '🌿' }, { id: 'patch', emo: '🧊' }, { id: 'antivirus', emo: '💉' },
  { id: 'bandage', emo: '🩹' }, { id: 'revive', emo: '💖' }, { id: 'checkup', emo: '🩺' },
];
const Health = {
  illCool: 60,
  /** Try to give the pet an ailment. Returns true if it took hold. */
  infect(id) {
    const p = S.pet;
    if (!p || p.stage === 0 || (S.cheats && S.cheats.god) || !AILMENTS[id]) return false;
    if (p.ailment && id !== 'fainted') return false;
    p.ailment = { id, t: 0 };
    UI.tick(t('ail.got.' + id, { n: p.name }), AILMENTS[id].emo);
    Sound.play('sad');
    Game.say(id === 'injury' ? 'hurt' : 'sick');
    Stage.react('sad', 1.5);
    UI.refresh(); saveSoon();
    return true;
  },
  faint() {
    const p = S.pet;
    if (!p || isFainted(p)) return;
    if (Stage.bath) Game.bathFinish(true);
    Stage.ball = null;
    if (Events.active) Events.end(true);
    UI.hud(null);
    p.ailment = { id: 'fainted', t: 0 };
    p.sleeping = false;
    UI.tick(t('ail.got.fainted', { n: p.name }), '💫');
    Sound.play('sad');
    UI.refresh(); saveNow();
  },
  /** Periodic random illness roll (game-time seconds). */
  tick(dt) {
    const p = S.pet;
    if (!p || p.stage === 0 || p.ailment || (S.cheats && S.cheats.god)) return;
    this.illCool -= dt;
    if (this.illCool > 0) return;
    this.illCool = 60;
    const st = p.stats;
    let chance = 0.012;
    if (st.hygiene < 30) chance += 0.06;
    if (st.energy < 15) chance += 0.04;
    if (st.hunger < 15 || st.thirst < 15) chance += 0.03;
    if (Math.random() >= chance) return;
    let id = 'cold';
    if (st.hygiene < 30) id = Math.random() < 0.6 ? 'tummy' : 'cold';
    else if (st.energy < 15) id = 'fever';
    else id = pick(['cold', 'cold', 'fever', 'tummy']);
    this.infect(id);
  },
  cure(cureId) {
    const p = S.pet;
    if (!p || p.stage === 0) return { ok: false, text: '' };
    const st = p.stats;
    const pc = Stage.petCenter();
    if (cureId === 'checkup') {
      const now = nowMs();
      if (p.ailment) return { ok: false, text: t('ail.checkSick', { c: t('cure.' + AILMENTS[p.ailment.id].cure) }) };
      if (now - (p.lastCheckup || 0) < 3 * 60 * 1000) return { ok: false, text: t('ail.checkSoon') };
      p.lastCheckup = now;
      Game.fx({ health: 12, mood: 4 });
      Particles.burst('heart', pc.x, pc.y, 5, 70, { size: 7, max: 1.1, color: '#6BE3A4' });
      Sound.play('happy'); saveSoon(); UI.refresh();
      return { ok: true, text: t('ail.checkOk') };
    }
    if (!p.ailment) { Sound.play('miss'); return { ok: false, text: t('ail.healthy') }; }
    const A = AILMENTS[p.ailment.id];
    if (A.cure !== cureId) { Sound.play('miss'); Game.fx({ mood: -3 }); return { ok: false, text: t('ail.wrong') }; }
    const was = p.ailment.id;
    p.ailment = null;
    if (was === 'fainted') { st.health = Math.max(st.health, 45); st.energy = Math.max(st.energy, 35); st.mood = Math.max(st.mood, 30); }
    else Game.fx({ health: 18 });
    Game.fx({ mood: 6 });
    Particles.burst('sparkle', pc.x, pc.y, 12, 120, { size: 6, max: 1.2, color: '#9CF5C8' });
    Particles.burst('heart', pc.x, pc.y, 6, 80, { size: 7, max: 1.2 });
    Stage.react('happy', 1.6); Stage.hop(200);
    Sound.play('happy'); Sound.play('heart');
    Game.say('cured');
    UI.tick(t('ail.cured', { n: p.name }), '💚');
    UI.refresh(); saveNow();
    return { ok: true, text: t('ail.cured', { n: p.name }) };
  },
};

/* =========================================================
   Random events: disasters, digital viruses, rainbows
   Drains are per game-minute.
   ========================================================= */
const EVENT_DEFS = {
  storm:    { emo: '⛈️', dur: 40, drain: { mood: 12, energy: 5, hygiene: 8 }, risk: ['cold', 0.35], w: 5 },
  heatwave: { emo: '🥵', dur: 45, drain: { thirst: 30, energy: 8 }, risk: ['fever', 0.35], w: 4 },
  blizzard: { emo: '🌨️', dur: 40, drain: { energy: 22, mood: 8 }, risk: ['cold', 0.4], w: 4 },
  quake:    { emo: '🌋', dur: 18, drain: { mood: 22 }, risk: ['injury', 0.45], w: 3 },
  flood:    { emo: '🌊', dur: 35, drain: { hygiene: 36, mood: 8 }, risk: ['tummy', 0.35], w: 3 },
  meteor:   { emo: '☄️', dur: 28, drain: { mood: 10 }, risk: ['injury', 0.35], reward: 10, w: 3 },
  virus:    { emo: '🦠', dur: 12, drain: {}, risk: ['virus', 1], w: 3 },
  rainbow:  { emo: '🌈', dur: 22, drain: {}, gain: { mood: 18 }, reward: 8, good: true, w: 3 },
};
const Events = {
  active: null, cool: 120, flash: 0, codeCols: null,
  canStart() {
    const p = S.pet;
    return p && p.stage > 0 && !p.sleeping && !isFainted(p) && !Stage.evo && !Stage.bath && !Stage.ball && !Battle.active && !UI.sheetOpen && !(S.cheats && S.cheats.god);
  },
  tick(dt) {
    const p = S.pet;
    if (!p || p.stage === 0) return;
    Health.tick(dt);
    const a = this.active;
    if (a) {
      const D = EVENT_DEFS[a.id];
      a.t += dt;
      const k = a.prot ? 0.15 : 1;
      for (const s in D.drain) p.stats[s] = clamp(p.stats[s] - (D.drain[s] * k) / 60 * dt, 0, 100);
      if (D.gain) for (const s in D.gain) p.stats[s] = clamp(p.stats[s] + D.gain[s] / 60 * dt, 0, 100);
      UI.hud(this.label(a), 1 - a.t / a.dur, true, a.prot ? null : t('ev.act.' + a.id), a.prot ? null : () => this.protect());
      if (a.t >= a.dur) this.end(false);
      return;
    }
    this.cool -= dt;
    if (this.cool > 0) return;
    if (!this.canStart()) { this.cool = 20; return; }
    this.cool = rand(110, 220);
    if (Math.random() > 0.55) return;
    const ids = Object.keys(EVENT_DEFS);
    const total = ids.reduce((s, id) => s + EVENT_DEFS[id].w, 0);
    let r = Math.random() * total, pickId = ids[0];
    for (const id of ids) { r -= EVENT_DEFS[id].w; if (r <= 0) { pickId = id; break; } }
    this.start(pickId);
  },
  label(a) { return `${EVENT_DEFS[a.id].emo} ${t('ev.' + a.id)}${a.prot ? ' ✓' : ''}`; },
  start(id) {
    if (this.active || !EVENT_DEFS[id]) return;
    const D = EVENT_DEFS[id];
    this.active = { id, t: 0, dur: D.dur, prot: false };
    this.flash = 0;
    UI.tick(t('ev.start.' + id), D.emo);
    Sound.play(id === 'virus' ? 'alarm' : id === 'rainbow' ? 'chime' : id === 'quake' ? 'rumble' : id === 'storm' ? 'thunder' : 'whoosh');
    if (id === 'quake') Stage.shake(D.dur);
    if (!D.good) { Stage.react('surprised', 1.2); Game.say('scared'); }
    else { Stage.react('happy', 1.5); Game.say('rainbow'); }
    UI.hud(this.label(this.active), 1, true, t('ev.act.' + id), () => this.protect());
  },
  protect() {
    const a = this.active;
    if (!a || a.prot) return;
    a.prot = true;
    const D = EVENT_DEFS[a.id];
    Sound.play('good');
    if (D.good) { Game.fx({ mood: 10 }); Game.addXp(D.reward || 5); Sound.play('happy'); UI.tick(t('ev.safe.' + a.id), D.emo); }
    else { Game.traits({ hrt: 2 }); UI.tick(t('ev.safe.' + a.id), '🛡️'); Stage.react('happy', 1.2); }
    if (a.id === 'virus') { this.end(false); return; }
    if (a.id === 'quake') Stage.shakeT = Math.min(Stage.shakeT || 0, 0.5);
    UI.hud(this.label(a), 1 - a.t / a.dur, true, null, null);
    saveSoon();
  },
  end(silent) {
    const a = this.active;
    if (!a) return;
    this.active = null;
    UI.hud(null);
    if (silent) return;
    const D = EVENT_DEFS[a.id];
    if (a.id === 'quake') Stage.shakeT = 0;
    if (!a.prot && D.risk && Math.random() < D.risk[1]) Health.infect(D.risk[0]);
    else if (a.prot && D.reward && !D.good) { Game.addXp(D.reward); UI.tick(t('ev.bonus.' + a.id), '✨'); }
    else UI.tick(t('ev.over'), '🌤️');
    UI.refresh(); saveSoon();
  },
  /* ---------- visuals, called from Stage ---------- */
  update(dt, W, H, floorY) {
    const a = this.active;
    if (!a || REDUCED) return;
    const P = Particles;
    switch (a.id) {
      case 'storm':
        for (let i = 0; i < 3; i++) if (Math.random() < dt * 40) P.add('rain', Math.random() * W * 1.2 - W * 0.1, -10, { vx: -80, vy: 620, max: (floorY + 10) / 620, size: 1 });
        if (Math.random() < dt * 0.25) { this.flash = 1; Sound.play('thunder'); }
        break;
      case 'blizzard':
        if (Math.random() < dt * 30) P.add('snow', Math.random() * W, -6, { vx: rand(-60, -20), vy: rand(50, 90), size: rand(1.5, 3.2), max: 4 });
        break;
      case 'meteor':
        if (Math.random() < dt * 1.6) P.add('beam', rand(W * 0.2, W * 1.1), rand(-10, H * 0.25), { vx: -260, vy: 180, dx: 50, dy: -35, size: 5, max: 1.2, color: 'rgba(255,200,120,0.95)' });
        break;
      case 'quake':
        if (Math.random() < dt * 2) P.add('rock', Math.random() * W, -8, { vy: 60, g: 600, vr: rand(-3, 3), size: rand(3, 6), max: 1.4 });
        break;
      case 'heatwave':
        if (Math.random() < dt * 3) P.add('ember', Math.random() * W, floorY, { vy: rand(-40, -20), size: rand(1, 2), max: 2, color: '#FFD08A' });
        break;
      case 'rainbow':
        if (Math.random() < dt * 4) P.add('sparkle', Math.random() * W, rand(H * 0.1, H * 0.5), { vy: -6, size: rand(3, 5), max: 1.2, color: pick(['#FF8A8A', '#FFD27A', '#8AE68A', '#7AC8FF', '#C59BFF']) });
        break;
    }
    this.flash = Math.max(0, this.flash - dt * 3);
  },
  drawBack(c, W, H, t, floorY) {
    const a = this.active;
    if (!a) return;
    const k = clamp(Math.min(a.t / 3, (a.dur - a.t) / 3, 1), 0, 1);
    switch (a.id) {
      case 'storm': c.fillStyle = `rgba(30,35,70,${0.45 * k})`; c.fillRect(0, 0, W, H); break;
      case 'heatwave': {
        c.fillStyle = `rgba(255,140,40,${0.2 * k})`; c.fillRect(0, 0, W, H);
        const g = c.createRadialGradient(W * 0.8, H * 0.12, 5, W * 0.8, H * 0.12, H * 0.6); g.addColorStop(0, `rgba(255,240,150,${0.7 * k})`); g.addColorStop(1, 'rgba(255,200,80,0)');
        c.fillStyle = g; c.fillRect(0, 0, W, H);
        break;
      }
      case 'blizzard': c.fillStyle = `rgba(225,240,255,${0.3 * k})`; c.fillRect(0, 0, W, H); break;
      case 'meteor': c.fillStyle = `rgba(20,10,50,${0.35 * k})`; c.fillRect(0, 0, W, H); break;
      case 'quake':
        c.strokeStyle = `rgba(70,45,30,${0.6 * k})`; c.lineWidth = 3; c.beginPath();
        c.moveTo(W * 0.1, floorY + 6); c.lineTo(W * 0.22, floorY + 18); c.lineTo(W * 0.3, floorY + 10); c.lineTo(W * 0.42, floorY + 26);
        c.moveTo(W * 0.62, floorY + 8); c.lineTo(W * 0.7, floorY + 22); c.lineTo(W * 0.84, floorY + 14); c.stroke();
        break;
      case 'rainbow': {
        const cols = ['#FF6B6B', '#FFB36B', '#FFE66B', '#7DE07D', '#6BC6FF', '#9B8CFF'];
        c.save(); c.globalAlpha = 0.45 * k; c.lineWidth = Math.max(6, H * 0.022);
        cols.forEach((col, i) => { c.strokeStyle = col; c.beginPath(); c.arc(W / 2, floorY + H * 0.05, H * 0.62 - i * c.lineWidth, Math.PI, 0); c.stroke(); });
        c.restore();
        break;
      }
      case 'virus': c.fillStyle = `rgba(0,60,40,${0.3 * k})`; c.fillRect(0, 0, W, H); break;
    }
  },
  drawFront(c, W, H, t, floorY) {
    const a = this.active;
    if (a) {
      const k = clamp(Math.min(a.t / 3, (a.dur - a.t) / 3, 1), 0, 1);
      if (a.id === 'flood') {
        const lvl = floorY - H * 0.08 * k;
        c.fillStyle = 'rgba(60,140,220,0.45)';
        c.beginPath(); c.moveTo(0, H);
        for (let x = 0; x <= W; x += 12) c.lineTo(x, lvl + Math.sin(x * 0.05 + t * 2.5) * 4);
        c.lineTo(W, H); c.closePath(); c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 2; c.beginPath();
        for (let x = 0; x <= W; x += 12) { const y = lvl + Math.sin(x * 0.05 + t * 2.5) * 4; x ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
      }
      if (a.id === 'heatwave' && !REDUCED) {
        c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 2;
        for (let i = 0; i < 5; i++) { c.beginPath(); const x0 = (i + 0.5) * W / 5; for (let y = floorY; y > floorY - H * 0.4; y -= 8) { const x = x0 + Math.sin(y * 0.08 + t * 4 + i) * 5; y === floorY ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
      }
      if (a.id === 'virus' && !REDUCED) {
        if (!this.codeCols || this.codeCols.length !== Math.ceil(W / 16)) this.codeCols = Array.from({ length: Math.ceil(W / 16) }, () => Math.random() * H);
        c.font = "700 12px ui-monospace, monospace"; c.fillStyle = 'rgba(80,255,160,0.55)';
        this.codeCols.forEach((y, i) => { c.fillText(Math.random() < 0.5 ? '0' : '1', i * 16, y); this.codeCols[i] = (y + 3) % H; });
        for (let i = 0; i < 3; i++) if (Math.random() < 0.4) { c.fillStyle = Math.random() < 0.5 ? 'rgba(255,0,200,0.18)' : 'rgba(0,255,220,0.18)'; c.fillRect(0, Math.random() * H, W, rand(3, 12)); }
      }
      if (a.prot && !EVENT_DEFS[a.id].good) {
        const pc = Stage.petCenter(), R = Stage.petR();
        const g = c.createRadialGradient(pc.x, pc.y, R * 0.8, pc.x, pc.y, R * 1.9);
        g.addColorStop(0, 'rgba(150,220,255,0.05)'); g.addColorStop(0.85, 'rgba(150,220,255,0.28)'); g.addColorStop(1, 'rgba(255,255,255,0.6)');
        c.fillStyle = g; c.beginPath(); c.arc(pc.x, pc.y + R * 0.2, R * 1.9, Math.PI, 0); c.lineTo(pc.x + R * 1.9, Stage.floorY); c.lineTo(pc.x - R * 1.9, Stage.floorY); c.closePath(); c.fill();
      }
    }
    if (this.flash > 0) { c.fillStyle = `rgba(255,255,255,${this.flash * 0.7})`; c.fillRect(0, 0, W, H); }
  },
};

/* =========================================================
   Training drills, cup shuffle (canvas) and result hooks
   ========================================================= */
function fitCanvas(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth || 300, hh = cv.clientHeight || 200;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hh * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hh);
  return { c, w, hh };
}
function miniPet(c, x, y, hh, opts) {
  const sp = curSpecies(), p = S.pet;
  const s = hh / (190 * sp.form.size + 70);
  drawPet(c, Object.assign({ sp, custom: p.custom, shiny: p.shiny, legendary: p.legendary, rainbow: p.rainbow, x, y, s, t: 0 }, opts));
  return 50 * s * sp.form.size;
}
const DRILLS = [
  { id: 'power', emo: '🥊' }, { id: 'endure', emo: '🪨' }, { id: 'agility', emo: '⭐' }, { id: 'memory', emo: '🧠' }, { id: 'zen', emo: '🧘' },
];
function drillAllowed(id) {
  const p = S.pet;
  if (isFainted(p) || p.sleeping) return false;
  return id === 'zen' ? true : Game.canTrain();
}

Object.assign(Game, {
  drillResult(id, score) {
    score = clamp(score, 0, 1);
    const g = Math.round(2 + score * 6);
    const p = S.pet, b = p.bstats;
    const add = (k, v) => { b[k] = Math.min(250, b[k] + v); };
    const parts = [];
    let tr = {};
    switch (id) {
      case 'power': add('atk', g); tr = { str: Math.ceil(g / 2) + 1 }; parts.push(`${t('b.atk')} +${g}`); break;
      case 'endure': add('def', g); add('hp', Math.ceil(g / 2)); tr = { str: Math.ceil(g / 3) + 1 }; parts.push(`${t('b.def')} +${g}`, `HP +${Math.ceil(g / 2)}`); break;
      case 'agility': add('spd', g); tr = { str: 1, int: Math.ceil(g / 3) }; parts.push(`${t('b.spd')} +${g}`); break;
      case 'memory': add('spd', Math.ceil(g / 2)); tr = { int: Math.ceil(g / 2) + 1 }; parts.push(`${t('b.spd')} +${Math.ceil(g / 2)}`); break;
      case 'zen': add('hp', g); tr = { hrt: Math.ceil(g / 2) + 1 }; parts.push(`HP +${g}`); break;
    }
    this.traits(tr);
    for (const k in tr) parts.push(`${t('fx.' + k)} +${tr[k]}`);
    if (id === 'zen') this.fx({ energy: 6, mood: 8, health: 3 });
    else this.fx({ energy: -11, hunger: -5, thirst: -7, hygiene: -3, mood: score > 0.3 ? 5 : -2 });
    const x = 4 + Math.round(score * 8);
    if (p.stage < 6) { parts.push(`${t('growth')} +${Math.max(1, Math.round(x * gameSpeed()))}`); this.addXp(x); }
    this.say(score >= 0.6 ? 'trainGood' : 'trainOk');
    UI.refresh(); saveSoon();
    return parts.join(' · ');
  },
  battleResult(win, info) {
    const p = S.pet, st = p.stats, god = !!S.cheats.god;
    p.battles[win ? 'w' : 'l']++;
    this.fx({ energy: -14, hunger: -8, thirst: -10, hygiene: -6, mood: win ? 10 : -4 });
    const fs = info.sp.stage;
    const base = win ? 10 + fs * 4 + (info.diff === 'hard' ? 8 : info.diff === 'boss' ? 25 : info.diff === 'friend' ? 6 : 0) : 4;
    const gain = win ? { atk: 2, def: 1, spd: 1, hp: 1 } : { def: 1, hp: 1 };
    const parts = [];
    for (const k in gain) { p.bstats[k] = Math.min(250, p.bstats[k] + gain[k]); parts.push(`${k === 'hp' ? 'HP' : t('b.' + k)} +${gain[k]}`); }
    this.traits({ str: win ? 3 : 1 });
    let dex = false;
    if (win && !S.dex[info.sp.id]) { S.dex[info.sp.id] = 1; dex = true; }
    let injured = false, fainted = false;
    if (!win && !god) {
      st.health = clamp(st.health - 12, 0, 100);
      if (st.health <= 0) { Health.faint(); fainted = true; }
      else if (Math.random() < 0.3) injured = Health.infect('injury');
    }
    const x = p.stage < 6 ? Math.max(1, Math.round(base * gameSpeed())) : 0;
    if (p.stage < 6) this.addXp(base);
    saveNow(); UI.refresh();
    return { x, stats: parts.join(' · '), dex, injured, fainted };
  },
  battleFled() { this.fx({ energy: -4, mood: -2 }); saveSoon(); },
});
// wrap actions for events & hygiene-related illness
(() => {
