Sheets.train = function (body) {
  const p = S.pet;
  if (isFainted(p)) { body.append(h('p', { class: 'note', text: t('ail.faintedHint') })); return; }
  if (p.sleeping) { body.append(h('p', { class: 'note', text: t('tick.sleeping') })); return; }
  if (!Game.canTrain()) body.append(h('p', { class: 'note', style: 'margin-bottom:12px', text: p.ailment ? t('b.needCure') : t('train.needs') }));
  const g = h('div', { class: 'item-grid' });
  DRILLS.forEach((d) => g.append(itemBtn(d.emo, t('drill.' + d.id), t('drill.fx.' + d.id), () => UI.openSheet('drill', d.id), !drillAllowed(d.id))));
  const b = p.bstats;
  body.append(g, h('p', { class: 'hint', style: 'margin-top:14px', text: t('drill.bonus', { a: b.atk, d: b.def, s: b.spd, h: b.hp }) }));
};
Sheets.drill = function (body, id) {
  $('#sheetTitle').textContent = t('drill.' + id);
  body.append(h('button', { class: 'btn secondary small', type: 'button', style: 'margin-bottom:12px', onclick: () => UI.openSheet('train') }, '← ' + t('sheet.train')));
  if (!drillAllowed(id)) { const p = S.pet; body.append(h('p', { class: 'note', text: isFainted(p) ? t('ail.faintedHint') : p.sleeping ? t('tick.sleeping') : p.ailment ? t('b.needCure') : t('train.needs') })); return; }
  body.append(h('p', { class: 'hint', text: t('drill.intro.' + id) }));
  const fn = DRILL_GAMES[id];
  if (fn) fn(body);
};
function drillEnd(result, btn, id, score) {
  const text = Game.drillResult(id, score);
  result.textContent = text;
  btn.textContent = t('train.again');
  btn.disabled = !drillAllowed(id);
}

const DRILL_GAMES = {
  /* 1. Power strike: timing */
  power(body) {
    const mini = h('canvas', { class: 'mini-stage', 'aria-hidden': 'true' });
    const zone = h('div', { class: 'zone' }), perf = h('div', { class: 'zone perfect' }), marker = h('div', { class: 'marker' });
    const track = h('div', { class: 'timing', role: 'button', tabindex: '0', 'aria-label': t('train.hit') }, zone, perf, marker);
    const dots = h('div', { class: 'round-dots', 'aria-hidden': 'true' }, [0, 1, 2, 3, 4].map(() => h('i')));
    const result = h('div', { class: 'result-line', 'aria-live': 'polite' });
    const btn = h('button', { class: 'btn block', type: 'button', text: t('train.start') });
    body.append(mini, track, dots, result, btn);
    const G = { phase: 'ready', round: 0, perfect: 0, good: 0, pos: 0.5, dir: 1, speed: 1, zc: 0.5, zw: 0.26, jump: 0, jv: 0, tt: 0, raf: 0, last: performance.now(), timers: [] };
    const layout = () => {
      zone.style.left = ((G.zc - G.zw / 2) * 100) + '%'; zone.style.width = (G.zw * 100) + '%';
      const pw = G.zw * 0.32; perf.style.left = ((G.zc - pw / 2) * 100) + '%'; perf.style.width = (pw * 100) + '%';
    };
    const newRound = () => { G.zc = rand(0.22, 0.78); G.zw = 0.26 - G.round * 0.025; G.speed = 0.85 + G.round * 0.2; G.pos = Math.random() < 0.5 ? 0.02 : 0.98; G.dir = G.pos < 0.5 ? 1 : -1; layout(); G.phase = 'run'; btn.textContent = t('train.hit'); };
    const startGame = () => {
      if (!drillAllowed('power')) { result.textContent = t('train.needs'); return; }
      G.round = 0; G.perfect = 0; G.good = 0; dots.querySelectorAll('i').forEach((i) => { i.className = ''; }); result.textContent = ''; newRound();
    };
    const hit = () => {
      if (G.phase !== 'run') return;
      const d = Math.abs(G.pos - G.zc);
      let r = 'm';
      if (d <= G.zw * 0.16) { r = 'p'; G.perfect++; Sound.play('perfect'); result.textContent = t('train.perfect'); G.jv = -420; }
      else if (d <= G.zw / 2) { r = 'g'; G.good++; Sound.play('good'); result.textContent = t('train.good'); G.jv = -300; }
      else { Sound.play('miss'); result.textContent = t('train.miss'); }
      dots.children[G.round].className = r;
      G.round++; G.phase = 'wait';
      G.timers.push(setTimeout(() => {
        if (UI.sheetKind !== 'drill') return;
        if (G.round >= 5) { G.phase = 'done'; drillEnd(result, btn, 'power', (G.perfect + G.good * 0.6) / 5); }
        else newRound();
      }, 750));
    };
    btn.addEventListener('click', () => { Sound.ensure(); if (G.phase === 'ready' || G.phase === 'done') startGame(); else hit(); });
    track.addEventListener('pointerdown', (e) => { e.preventDefault(); hit(); });
    track.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); hit(); } });
    const loop = (ts) => {
      const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.tt += dt;
      if (G.phase === 'run') { G.pos += G.dir * G.speed * dt; if (G.pos > 1) { G.pos = 1; G.dir = -1; } if (G.pos < 0) { G.pos = 0; G.dir = 1; } }
      marker.style.left = (G.pos * 100) + '%';
      G.jv += 1300 * dt; G.jump += G.jv * dt; if (G.jump > 0) { G.jump = 0; G.jv = 0; }
      const { c, w, hh } = fitCanvas(mini);
      c.fillStyle = 'rgba(60,160,90,0.25)'; c.fillRect(0, hh * 0.86, w, hh * 0.14);
      const s = hh / 330;
      c.fillStyle = '#C98B5A'; c.beginPath(); c.roundRect ? c.roundRect(w * 0.68, hh * 0.3, 26 * s * 3, hh * 0.56, 10) : c.rect(w * 0.68, hh * 0.3, 26 * s * 3, hh * 0.56); c.fill();
      miniPet(c, w * 0.45, hh * 0.88 + G.jump * s, hh, { t: G.tt, face: G.jump < -5 ? 'happy' : 'neutral', look: { x: 1, y: 0 }, squash: G.jump < 0 ? -0.06 : 0, dir: 1 });
      G.raf = requestAnimationFrame(loop);
    };
    G.raf = requestAnimationFrame(loop);
    UI.cleanup = () => { cancelAnimationFrame(G.raf); G.timers.forEach(clearTimeout); };
  },
  /* 2. Endurance: boulder push (rapid taps) */
  endure(body) {
    const hud = h('div', { class: 'drill-hud' }, h('span', { id: 'dhA' }), h('span', { id: 'dhB' }));
    const cv = h('canvas', { class: 'game-cv', 'aria-hidden': 'true' });
    const result = h('div', { class: 'result-line', 'aria-live': 'polite' });
    const btn = h('button', { class: 'btn block big-tap', type: 'button', text: t('train.start') });
    body.append(hud, cv, result, btn);
    const G = { phase: 'ready', prog: 0, time: 8, push: 0, tt: 0, raf: 0, last: performance.now(), fx: makeParticles() };
    const setHud = () => { $('#dhA').textContent = `🪨 ${Math.round(G.prog * 100)}%`; $('#dhB').textContent = `⏱ ${Math.max(0, G.time).toFixed(1)}s`; };
    const start = () => { if (!drillAllowed('endure')) { result.textContent = t('train.needs'); return; } G.phase = 'run'; G.prog = 0; G.time = 8; result.textContent = ''; btn.textContent = t('drill.push'); };
    const push = () => {
      if (G.phase !== 'run') return;
      G.prog = Math.min(1, G.prog + 0.03); G.push = 0.15;
      if (G.prog >= 1) { end(); return; }
      Sound.play('thud');
      const { w, hh } = { w: cv.clientWidth, hh: cv.clientHeight };
      G.fx.burst('rock', w * 0.3 + G.prog * w * 0.45, hh * 0.86, 2, 50, { size: 2, g: 200, max: 0.6 });
    };
    const end = () => { G.phase = 'done'; drillEnd(result, btn, 'endure', G.prog >= 1 ? 1 : G.prog * 0.9); if (G.prog >= 1) Sound.play('perfect'); };
    btn.addEventListener('pointerdown', (e) => { if (G.phase === 'run') { e.preventDefault(); push(); } });
    btn.addEventListener('click', () => { Sound.ensure(); if (G.phase === 'ready' || G.phase === 'done') start(); });
    btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && G.phase === 'run') { e.preventDefault(); push(); } });
    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); push(); });
    const loop = (ts) => {
      const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.tt += dt;
      if (G.phase === 'run') { G.time -= dt; if (G.time <= 0) end(); else G.prog = Math.max(0, G.prog - 0.05 * dt); }
      G.push = Math.max(0, G.push - dt); G.fx.update(dt);
      const { c, w, hh } = fitCanvas(cv);
      const sky = c.createLinearGradient(0, 0, 0, hh); sky.addColorStop(0, '#FFE2B8'); sky.addColorStop(1, '#FFF5E6'); c.fillStyle = sky; c.fillRect(0, 0, w, hh);
      c.fillStyle = '#D9B98A'; c.fillRect(0, hh * 0.86, w, hh * 0.14);
      // finish flag
      c.fillStyle = '#6B4FD8'; c.fillRect(w * 0.9, hh * 0.45, 3, hh * 0.41); c.fillStyle = '#FF6FA3'; c.beginPath(); c.moveTo(w * 0.9 + 3, hh * 0.45); c.lineTo(w * 0.9 + 28, hh * 0.52); c.lineTo(w * 0.9 + 3, hh * 0.59); c.fill();
      const rr = hh * 0.2, bx = w * 0.32 + G.prog * w * 0.45;
      c.save(); c.translate(bx, hh * 0.86 - rr); c.rotate(G.prog * 6);
      c.beginPath(); c.moveTo(-rr, 0); c.lineTo(-rr * 0.6, -rr * 0.85); c.lineTo(rr * 0.4, -rr); c.lineTo(rr, -rr * 0.2); c.lineTo(rr * 0.7, rr * 0.8); c.lineTo(-rr * 0.5, rr * 0.9); c.closePath();
      c.fillStyle = '#9C8E80'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#5E5247'; c.stroke(); c.restore();
      const R = miniPet(c, bx - rr - hh * 0.18, hh * 0.88, hh, { t: G.tt, face: G.phase === 'run' ? (G.push > 0 ? 'happy' : 'neutral') : (G.prog >= 1 && G.phase === 'done' ? 'happy' : 'neutral'), dir: 1, look: { x: 1, y: 0 }, squash: G.push > 0 ? 0.1 : 0 });
      if (G.phase === 'run' && Math.random() < dt * 2) G.fx.add('drop', bx - rr - hh * 0.18 + R * 0.6, hh * 0.88 - R * 1.8, { vy: 30, g: 200, size: 3, max: 0.7 });
      G.fx.draw(c);
      setHud();
      G.raf = requestAnimationFrame(loop);
    };
    G.raf = requestAnimationFrame(loop);
    UI.cleanup = () => cancelAnimationFrame(G.raf);
  },
  /* 3. Agility: catch stars, dodge spikes */
  agility(body) {
    const hud = h('div', { class: 'drill-hud' }, h('span', { id: 'dhA' }), h('span', { id: 'dhB' }));
    const cv = h('canvas', { class: 'game-cv tall', 'aria-label': t('drill.agility') });
    const left = h('button', { class: 'btn secondary', type: 'button', 'aria-label': '←', text: '◀' });
    const right = h('button', { class: 'btn secondary', type: 'button', 'aria-label': '→', text: '▶' });
    const result = h('div', { class: 'result-line', 'aria-live': 'polite' });
    const btn = h('button', { class: 'btn block', type: 'button', text: t('train.start') });
    body.append(hud, cv, h('div', { class: 'pick3 two' }, left, right), result, btn);
    const G = { phase: 'ready', time: 20, px: 0.5, tx: 0.5, items: [], caught: 0, stun: 0, spawn: 0, dir: 0, tt: 0, raf: 0, last: performance.now(), fx: makeParticles() };
    const setHud = () => { $('#dhA').textContent = `⭐ ${G.caught}`; $('#dhB').textContent = `⏱ ${Math.max(0, Math.ceil(G.time))}s`; };
    const start = () => { if (!drillAllowed('agility')) { result.textContent = t('train.needs'); return; } Object.assign(G, { phase: 'run', time: 20, items: [], caught: 0, stun: 0, spawn: 0.3 }); result.textContent = ''; btn.disabled = true; btn.textContent = t('drill.catch'); };
    const setX = (e) => { const r = cv.getBoundingClientRect(); G.tx = clamp((e.clientX - r.left) / r.width, 0.06, 0.94); };
    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); setX(e); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } });
    cv.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'mouse') setX(e); });
    const hold = (b, d) => { b.addEventListener('pointerdown', (e) => { e.preventDefault(); G.dir = d; }); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => { if (G.dir === d) G.dir = 0; })); };
    hold(left, -1); hold(right, 1);
    const key = (e) => { if (UI.sheetKind !== 'drill') return; if (e.key === 'ArrowLeft') { G.dir = e.type === 'keydown' ? -1 : 0; e.preventDefault(); } if (e.key === 'ArrowRight') { G.dir = e.type === 'keydown' ? 1 : 0; e.preventDefault(); } };
    document.addEventListener('keydown', key); document.addEventListener('keyup', key);
    btn.addEventListener('click', () => { Sound.ensure(); if (G.phase !== 'run') start(); });
    const loop = (ts) => {
      const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.tt += dt;
      const { c, w, hh } = fitCanvas(cv);
      G.fx.update(dt);
      if (G.dir) G.tx = clamp(G.tx + G.dir * 1.1 * dt, 0.06, 0.94);
      if (G.stun <= 0) G.px += (G.tx - G.px) * Math.min(1, dt * 10); else G.stun -= dt;
      const R = (hh / (190 * curSpecies().form.size + 70)) * 50 * curSpecies().form.size;
      const petX = G.px * w, petY = hh * 0.93;
      if (G.phase === 'run') {
        G.time -= dt; G.spawn -= dt;
        const el = 20 - G.time;
        if (G.spawn <= 0) { G.spawn = Math.max(0.28, 0.6 - el * 0.015); G.items.push({ x: rand(0.06, 0.94) * w, y: -12, vy: (110 + el * 7) * (hh / 240), kind: Math.random() < 0.28 ? 'spike' : 'star', r: 11, rot: 0 }); }
        for (const it of G.items) {
          it.y += it.vy * dt; it.rot += dt * 3;
          if (!it.done && Math.hypot(it.x - petX, it.y - (petY - R)) < it.r + R * 0.95) {
            it.done = true;
            if (it.kind === 'star') { G.caught++; Sound.play('good'); G.fx.burst('sparkle', it.x, it.y, 6, 90, { size: 5, max: 0.6, color: '#FFE36B' }); }
            else { G.caught = Math.max(0, G.caught - 1); G.stun = 0.7; Sound.play('miss'); G.fx.burst('poof', it.x, it.y, 4, 40, { size: 8, max: 0.5 }); }
          }
        }
        G.items = G.items.filter((it) => !it.done && it.y < hh + 20);
        if (G.time <= 0) { G.phase = 'done'; G.items = []; btn.disabled = false; drillEnd(result, btn, 'agility', G.caught / 14); }
      }
      const sky = c.createLinearGradient(0, 0, 0, hh); sky.addColorStop(0, '#2B2A6B'); sky.addColorStop(1, '#6D63C9'); c.fillStyle = sky; c.fillRect(0, 0, w, hh);
      c.fillStyle = 'rgba(255,255,255,0.5)'; for (let i = 0; i < 20; i++) { c.beginPath(); c.arc((i * 71) % w, (i * 37) % (hh * 0.8), 1, 0, Math.PI * 2); c.fill(); }
      c.fillStyle = '#4C43A8'; c.fillRect(0, hh * 0.93, w, hh * 0.07);
      for (const it of G.items) {
        if (it.kind === 'star') { c.save(); c.translate(it.x, it.y); c.rotate(it.rot); starPath(c, 0, 0, it.r, 5); c.fillStyle = '#FFE36B'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#C99A00'; c.stroke(); c.restore(); }
        else { c.save(); c.translate(it.x, it.y); c.rotate(it.rot); starPath(c, 0, 0, it.r * 1.1, 8, 0.55); c.fillStyle = '#3A2E5A'; c.fill(); c.beginPath(); c.arc(0, 0, it.r * 0.5, 0, Math.PI * 2); c.fillStyle = '#FF5C7A'; c.fill(); c.restore(); }
      }
      miniPet(c, petX, petY, hh, { t: G.tt, face: G.stun > 0 ? 'dizzy' : G.phase === 'run' ? 'happy' : 'neutral', walk: Math.abs(G.tx - G.px) > 0.01, dir: G.tx >= G.px ? 1 : -1 });
      G.fx.draw(c);
      setHud();
      G.raf = requestAnimationFrame(loop);
    };
    G.raf = requestAnimationFrame(loop);
    UI.cleanup = () => { cancelAnimationFrame(G.raf); document.removeEventListener('keydown', key); document.removeEventListener('keyup', key); };
  },
  /* 4. Memory: echo pads */
  memory(body) {
    const cols = ['#FF6B6B', '#3FA9F5', '#FFC21A', '#2FC48A'], emo = ['🍓', '💧', '⭐', '🍀'], notes = [64, 67, 71, 74];
    const label = h('div', { class: 'result-line', 'aria-live': 'polite', text: t('mem.ready') });
    const pads = h('div', { class: 'pads' });
    const padBtns = cols.map((col, i) => { const b = h('button', { class: 'pad', type: 'button', disabled: true, style: `--pad:${col}`, 'aria-label': emo[i] }, emo[i]); pads.append(b); return b; });
    const dots = h('div', { class: 'round-dots', 'aria-hidden': 'true' }, [0, 1, 2, 3, 4].map(() => h('i')));
    const btn = h('button', { class: 'btn block', type: 'button', text: t('train.start') });
    const result = h('div', { class: 'result-line', 'aria-live': 'polite' });
    body.append(label, pads, dots, result, btn);
    const G = { phase: 'ready', seq: [], idx: 0, round: 0, timers: [] };
    const later = (fn, ms) => G.timers.push(setTimeout(() => { if (UI.sheetKind === 'drill') fn(); }, ms));
    const light = (i, ms) => { padBtns[i].classList.add('lit'); Sound.play('pad', notes[i]); later(() => padBtns[i].classList.remove('lit'), ms); };
    const enable = (on) => padBtns.forEach((b) => { b.disabled = !on; });
    const playSeq = () => {
      G.phase = 'show'; enable(false); label.textContent = t('mem.watch');
      const gap = Math.max(380, 640 - G.round * 55);
      G.seq.forEach((v, k) => later(() => light(v, gap * 0.7), 400 + k * gap));
      later(() => { G.phase = 'input'; G.idx = 0; enable(true); label.textContent = t('mem.turn'); padBtns[0].focus({ preventScroll: true }); }, 400 + G.seq.length * gap);
    };
    const end = (score) => { G.phase = 'done'; enable(false); btn.disabled = false; drillEnd(result, btn, 'memory', score); };
    padBtns.forEach((b, i) => b.addEventListener('click', () => {
      if (G.phase !== 'input') return;
      light(i, 220);
      if (i === G.seq[G.idx]) {
        G.idx++;
        if (G.idx >= G.seq.length) {
          dots.children[G.round].className = 'g';
          G.round++; G.phase = 'wait'; enable(false);
          if (G.round >= 5) { label.textContent = t('mem.perfect'); Sound.play('perfect'); end(1); }
          else { label.textContent = t('mem.great'); G.seq.push(Math.floor(Math.random() * 4)); later(playSeq, 800); }
        }
      } else {
        dots.children[G.round].className = 'm';
        Sound.play('miss'); label.textContent = t('mem.oops');
        end(G.round / 5);
      }
    }));
    btn.addEventListener('click', () => {
      Sound.ensure();
      if (G.phase === 'ready' || G.phase === 'done') {
        if (!drillAllowed('memory')) { result.textContent = t('train.needs'); return; }
        G.seq = [Math.floor(Math.random() * 4), Math.floor(Math.random() * 4)]; G.round = 0; result.textContent = '';
        dots.querySelectorAll('i').forEach((x) => { x.className = ''; });
        btn.disabled = true; playSeq();
      }
    });
    UI.cleanup = () => G.timers.forEach(clearTimeout);
  },
  /* 5. Zen breathing */
  zen(body) {
    const cv = h('canvas', { class: 'game-cv', 'aria-hidden': 'true' });
    const dots = h('div', { class: 'round-dots', 'aria-hidden': 'true' }, [0, 1, 2, 3, 4].map(() => h('i')));
    const label = h('div', { class: 'result-line', 'aria-live': 'polite', text: t('zen.ready') });
    const btn = h('button', { class: 'btn block big-tap', type: 'button', text: t('train.start') });
    const result = h('div', { class: 'result-line', 'aria-live': 'polite' });
    body.append(cv, dots, label, btn, result);
    const band = [0.7, 0.86];
    const G = { phase: 'ready', r: 0.15, holding: false, breath: 0, score: 0, tt: 0, raf: 0, last: performance.now(), fb: 0, fbCol: '#FFFFFF' };
    const startGame = () => { if (!drillAllowed('zen')) return; Object.assign(G, { phase: 'inhale', r: 0.15, breath: 0, score: 0, holding: false }); dots.querySelectorAll('i').forEach((x) => { x.className = ''; }); result.textContent = ''; label.textContent = t('zen.hold'); btn.textContent = t('zen.btn'); };
    const release = (auto) => {
      if (G.phase !== 'inhale' || !G.holding) return;
      G.holding = false;
      const r = G.r;
      let cls = 'm';
      if (!auto && r >= band[0] && r <= band[1]) {
        const mid = (band[0] + band[1]) / 2, prec = 1 - Math.abs(r - mid) / ((band[1] - band[0]) / 2);
        G.score += 0.6 + 0.4 * prec; cls = prec > 0.6 ? 'p' : 'g';
        label.textContent = prec > 0.6 ? t('zen.perfect') : t('zen.good'); Sound.play(prec > 0.6 ? 'perfect' : 'good'); G.fb = 1; G.fbCol = '#9CF5C8';
      } else { label.textContent = auto ? t('zen.long') : t('zen.short'); Sound.play('miss'); G.fb = 1; G.fbCol = '#FFB0B0'; }
      dots.children[G.breath].className = cls;
      G.breath++; G.phase = 'exhale';
    };
    btn.addEventListener('pointerdown', (e) => { if (G.phase === 'inhale' && !G.holding && G.r <= 0.2) { e.preventDefault(); G.holding = true; Sound.play('breathe'); } });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, () => release(false)));
    btn.addEventListener('click', () => { Sound.ensure(); if (G.phase === 'ready' || G.phase === 'done') startGame(); });
    btn.addEventListener('keydown', (e) => { if (e.key === ' ' && G.phase === 'inhale' && !G.holding && !e.repeat) { e.preventDefault(); G.holding = true; } });
    btn.addEventListener('keyup', (e) => { if (e.key === ' ') { e.preventDefault(); release(false); } });
    const loop = (ts) => {
      const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.tt += dt;

/* ---------- Treat shuffle (rebuilt on canvas) ---------- */
Sheets.cups = function (body) {
  body.append(backBtn('play'));
  const label = h('div', { class: 'result-line', 'aria-live': 'polite', text: t('cups.intro') });
  const cv = h('canvas', { class: 'game-cv', 'aria-label': t('cups.pick') });
  const pickRow = h('div', { class: 'pick3' });
  const pickBtns = [0, 1, 2].map((s) => { const b = h('button', { class: 'btn secondary small', type: 'button', disabled: true, text: t('cups.slot.' + s) }); pickRow.append(b); return b; });
  const btn = h('button', { class: 'btn block', type: 'button', style: 'margin-top:12px', text: t('cups.start') });
  body.append(label, cv, pickRow, btn);
  const G = {
    cups: [0, 1, 2].map((i) => ({ slot: i, from: i, to: i, lift: 0, liftTo: 0, y: 0 })), treat: 0, round: 0, found: 0, phase: 'idle',
    swap: null, swaps: 0, gap: 0.4, timers: [], raf: 0, last: performance.now(), tt: 0, fx: makeParticles(),
  };
  const later = (fn, ms) => G.timers.push(setTimeout(() => { if (UI.sheetKind === 'cups') fn(); }, ms));
  const liftAll = (v) => G.cups.forEach((c) => { c.liftTo = v; });
  const cupAtSlot = (s) => G.cups.findIndex((c) => Math.round(c.slot) === s);
  const setPick = (on) => pickBtns.forEach((b) => { b.disabled = !on; });
  const startRound = () => {
    G.round++; G.phase = 'show'; btn.disabled = true; setPick(false);
    label.textContent = t('cups.round', { n: G.round });
    G.cups.forEach((c, i) => { c.slot = i; c.from = i; c.to = i; });
    G.treat = Math.floor(Math.random() * 3);
    liftAll(1);
    later(() => { liftAll(0); }, 1200);
    later(() => { G.phase = 'shuffle'; G.swaps = 4 + G.round * 2; G.gap = Math.max(0.24, 0.42 - G.round * 0.06); nextSwap(); }, 1750);
  };
  const nextSwap = () => {
    if (G.swaps <= 0) { G.swap = null; G.phase = 'pick'; label.textContent = t('cups.pick'); setPick(true); return; }
    G.swaps--;
    const a = Math.floor(Math.random() * 3); let b = Math.floor(Math.random() * 2); if (b >= a) b++;
    const ca = G.cups[a], cb = G.cups[b];
    ca.from = ca.slot; ca.to = cb.slot; cb.from = cb.slot; cb.to = ca.slot;
    G.swap = { a, b, k: 0, dur: G.gap };
    Sound.play('shuffle');
  };
  const choose = (slot) => {
    if (G.phase !== 'pick') return;
    const i = cupAtSlot(slot); if (i < 0) return;
    G.phase = 'reveal'; setPick(false);
    G.cups[i].liftTo = 1;
    if (i === G.treat) { G.found++; label.textContent = t('cups.win'); Sound.play('happy'); Game.say('cupWin'); later(() => { const x = slotX(G.cups[i].slot); G.fx.burst('sparkle', x, lastH * 0.55, 10, 90, { size: 6, max: 0.9 }); }, 250); }
    else { label.textContent = t('cups.lose'); Sound.play('miss'); later(() => { G.cups[G.treat].liftTo = 1; }, 450); Game.say('cupLose'); }
    later(() => {
      liftAll(0);
      if (G.round >= 3) {
        later(() => {
          const x = Game.cupsResult(G.found);
          label.textContent = t('cups.done', { n: G.found, x: Math.max(1, Math.round(x * gameSpeed())) });
          G.round = 0; G.found = 0; G.phase = 'idle'; btn.disabled = false; btn.textContent = t('cups.start');
        }, 400);
      } else later(startRound, 700);
    }, 1600);
  };
  pickBtns.forEach((b, s) => b.addEventListener('click', () => choose(s)));
  let lastW = 300, lastH = 220;
  const slotX = (s) => lastW * (0.2 + s * 0.3);
  cv.addEventListener('pointerdown', (e) => {
    if (G.phase !== 'pick') return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
    const cw = Math.min(lastW * 0.24, 110);
    for (let s = 0; s < 3; s++) if (Math.abs(x - slotX(s)) < cw * 0.6) { choose(s); return; }
  });
  const onKey = (e) => { if (UI.sheetKind !== 'cups') return; if (['1', '2', '3'].includes(e.key)) choose(+e.key - 1); };
  document.addEventListener('keydown', onKey);
  btn.addEventListener('click', () => { Sound.ensure(); if (G.phase === 'idle') startRound(); });
  const drawStrawberry = (c, x, y, s) => {
    c.save(); c.translate(x, y);
    c.beginPath(); c.moveTo(0, s * 0.9); c.bezierCurveTo(-s * 1.1, s * 0.2, -s * 0.8, -s * 0.8, 0, -s * 0.6); c.bezierCurveTo(s * 0.8, -s * 0.8, s * 1.1, s * 0.2, 0, s * 0.9);
    c.fillStyle = '#FF4D6D'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#B8243F'; c.stroke();
    c.fillStyle = '#FFE8A3'; for (let i = 0; i < 7; i++) { c.beginPath(); c.ellipse(Math.cos(i * 2.4) * s * 0.4, Math.sin(i * 2.4) * s * 0.35 + s * 0.05, 1.6, 2.4, 0, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = '#3FAE4A'; for (let i = -1; i <= 1; i++) { c.beginPath(); c.ellipse(i * s * 0.28, -s * 0.66, s * 0.24, s * 0.1, i * 0.6, 0, Math.PI * 2); c.fill(); }
    c.restore();
  };
  const drawCup = (c, x, baseY, cw, chh, lift, shadowK) => {
    const y = baseY - lift;
    c.fillStyle = `rgba(40,20,60,${0.22 * shadowK})`; c.beginPath(); c.ellipse(x, baseY + 3, cw * 0.55 * (1 - lift / 200), 7, 0, 0, Math.PI * 2); c.fill();
    c.save(); c.translate(x, y);
    const g = c.createLinearGradient(-cw / 2, 0, cw / 2, 0); g.addColorStop(0, '#6F4FE0'); g.addColorStop(0.45, '#A58BFF'); g.addColorStop(1, '#5B3FCC');
    c.beginPath(); c.moveTo(-cw * 0.5, 0); c.lineTo(-cw * 0.36, -chh); c.quadraticCurveTo(0, -chh - 8, cw * 0.36, -chh); c.lineTo(cw * 0.5, 0); c.quadraticCurveTo(0, 8, -cw * 0.5, 0); c.closePath();
    c.fillStyle = g; c.fill(); c.lineWidth = 3; c.strokeStyle = '#3E2A96'; c.stroke();
    c.fillStyle = '#FFCF3D'; c.beginPath(); c.moveTo(-cw * 0.46, -chh * 0.28); c.lineTo(cw * 0.46, -chh * 0.28); c.lineTo(cw * 0.43, -chh * 0.42); c.lineTo(-cw * 0.43, -chh * 0.42); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.4)'; c.beginPath(); c.ellipse(-cw * 0.2, -chh * 0.68, cw * 0.06, chh * 0.18, 0.15, 0, Math.PI * 2); c.fill();
    c.restore();
  };
  const loop = (ts) => {
    const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.tt += dt;
    const { c, w, hh } = fitCanvas(cv); lastW = w; lastH = hh;
    for (const cup of G.cups) cup.lift += (cup.liftTo - cup.lift) * Math.min(1, dt * 9);
    if (G.swap) {
      const S2 = G.swap; S2.k += dt / S2.dur;
      const e = S2.k >= 1 ? 1 : (1 - Math.cos(S2.k * Math.PI)) / 2;
      for (const idx of [S2.a, S2.b]) { const cp = G.cups[idx]; cp.slot = lerp(cp.from, cp.to, e); cp.y = Math.sin(e * Math.PI) * (idx === S2.a ? -26 : 10); }
      if (S2.k >= 1) { for (const idx of [S2.a, S2.b]) { const cp = G.cups[idx]; cp.slot = cp.to; cp.y = 0; } G.swap = null; later(nextSwap, 50); }
    }
    G.fx.update(dt);
    const bg = c.createLinearGradient(0, 0, 0, hh); bg.addColorStop(0, '#FFF1E0'); bg.addColorStop(1, '#FFE3F0'); c.fillStyle = bg; c.fillRect(0, 0, w, hh);
    const tableY = hh * 0.8;
    const tg = c.createLinearGradient(0, tableY - 10, 0, hh); tg.addColorStop(0, '#E0A36E'); tg.addColorStop(1, '#B9784A');
    c.fillStyle = tg; c.fillRect(0, tableY - 6, w, hh - tableY + 6);
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.fillRect(0, tableY - 6, w, 3);
    const cw = Math.min(w * 0.24, 110), chh = Math.min(hh * 0.5, cw * 1.05);
    // treat under its cup (drawn first so the cup covers it)
    const tc = G.cups[G.treat];
    if (tc.lift > 0.04 || G.phase === 'show') drawStrawberry(c, slotX(tc.slot), tableY - chh * 0.28, Math.min(22, cw * 0.2));
    // draw lower cups first, the "over" cup of a swap last
    const order = [0, 1, 2].sort((a, b) => G.cups[b].y - G.cups[a].y);
    for (const i of order) { const cp = G.cups[i]; drawCup(c, slotX(cp.slot), tableY + cp.y * (cp.y > 0 ? 0.3 : 1), cw, chh, cp.lift * chh * 0.85 - Math.min(0, cp.y), 1); }
    G.fx.draw(c);
    if (G.phase === 'pick') { c.fillStyle = 'rgba(107,79,216,0.9)'; c.font = "800 14px 'Baloo 2', system-ui, sans-serif"; c.textAlign = 'center'; for (let s = 0; s < 3; s++) c.fillText(String(s + 1), slotX(s), tableY + 22); }
    G.raf = requestAnimationFrame(loop);
  };
  G.raf = requestAnimationFrame(loop);
  UI.cleanup = () => { cancelAnimationFrame(G.raf); G.timers.forEach(clearTimeout); document.removeEventListener('keydown', onKey); };
};

/* =========================================================
   Net: live park (room presence), pet chat (sample), downloads
   All optional; the app works fully without them.
   ========================================================= */
const Net = {
  room: null, sample: null, downloads: null, onParkChange: null, lastJoinTick: 0, lastGreet: 0,
  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const use = (n) => { try { return Promise.resolve(window.claude.use(n)).catch(() => null); } catch (e) { return Promise.resolve(null); } };
    const [room, sample, downloads] = await Promise.all([use('room'), use('sample'), use('downloads')]);
    this.sample = typeof sample === 'function' ? sample : null;
    this.downloads = downloads && typeof downloads.save === 'function' ? downloads : null;
    if (room && typeof room.onPeers === 'function') {
      this.room = room;
      const dead = () => { this.room = null; if (this.onParkChange) this.onParkChange(); };
      room.onPeers((ch) => {
        const now = nowMs();
        for (const pr of ch.joined || []) {
          if (pr.isMe) continue;
          const card = validateCard(pr.presence && pr.presence.pet);
          if (card && now - this.lastJoinTick > 20000 && S && S.pet && S.pet.stage > 0) { this.lastJoinTick = now; UI.tick(t('tick.newFriend', { n: card.n }), '🌳'); Sound.play('notify'); }
        }
        if (ch.updated && ch.updated.length === 0 && ch.joined.length === 0 && ch.left.length === 0) return;
        if (this.onParkChange) this.onParkChange();
      }, dead);
      room.on('greet', (msg) => {
        if (!msg || msg.isMe || !S || !S.pet) return;
        const d = msg.data || {};
        const me = this.myPeer();
        if (!me || d.to !== me) return;
        const now = nowMs();
        if (now - this.lastGreet < 8000) return;
        this.lastGreet = now;
        const o = cleanText(typeof d.o === 'string' ? d.o : '', 16) || '🙂', n = cleanText(typeof d.n === 'string' ? d.n : '', 14) || 'Pal';
        UI.tick(t('pd.greeted', { o, n }), '💞'); Sound.play('friend');
        if (S.pet.stage > 0 && !S.pet.sleeping) { Game.fx({ mood: 5 }); Stage.react('happy', 1.5); Stage.hop(200); const pc = Stage.petCenter(); Particles.burst('heart', pc.x, pc.y, 5, 80, { size: 8, max: 1.2 }); }
      }, () => {});
      this.updatePresence();
    }
    if (UI.sheetOpen && (UI.sheetKind === 'play' || UI.sheetKind === 'friends')) UI.renderSheet();
  },
  myPeer() { if (!this.room) return null; try { const me = this.room.peers().find((p) => p.sameTab); return me ? me.peer : null; } catch (e) { return null; } },
  livePets() {
    if (!this.room) return [];
    let peers = [];
    try { peers = this.room.peers(); } catch (e) { return []; }
    const out = [], seen = new Set();
    for (const pr of peers) {
      if (pr.isMe || pr.kind !== 'viewer') continue;
      const card = validateCard(pr.presence && pr.presence.pet);
      if (!card || seen.has(card.i) || (S.pet && card.i === S.pet.id)) continue;
      seen.add(card.i); out.push({ card, peer: pr.peer });
    }
    return out.slice(0, 20);
  },
  updatePresence() {
    if (!this.room || !S || !S.pet) return;
    const pet = S.pet.stage > 0 ? myCard() : null;
    try { this.room.presence({ pet, app: 'pocketpal' }).catch(() => {}); } catch (e) { /* ignore */ }
  },
  greet(peer, kind) {
    if (!this.room || !peer) return;
    try { this.room.emit('greet', { to: peer, o: S.owner || '', n: S.pet.name, k: kind }).catch(() => {}); } catch (e) { /* ignore */ }
  },
};

      requestAnimationFrame(() => renderEggThumb(cv, i, 64, this.clan));
    });
    const name = h('input', { class: 'input', type: 'text', maxlength: '14', placeholder: t('start.namePh'), id: 'petNameIn' });
    const owner = h('input', { class: 'input', type: 'text', maxlength: '16', placeholder: t('start.ownerPh'), id: 'ownerIn' });
    owner.value = S.owner || '';
    const go = h('button', { class: 'btn block', type: 'button', text: t('start.go') });
    go.addEventListener('click', () => {
      const n = cleanText(name.value, 14) || (LANG === 'zh' ? '麻糬' : 'Mochi');
      S.owner = cleanText(owner.value, 16);
      S.pet = newPet(this.egg, n, this.clan);
      S.pet.custom.bg = CLAN_BG[this.clan] || 'meadow';
      saveNow();
      this.begin(true);
    });
    inner.append(h('div', { class: 'card' },
      h('h2', { class: 'pet-name', style: 'margin:0 0 4px;white-space:normal', text: t('start.clan') }),
      clanRow, clanDesc,
      h('h2', { class: 'pet-name', style: 'margin:14px 0 4px;white-space:normal', text: t('start.choose') }),
      h('p', { class: 'hint', text: t('start.chooseHint') }), grid,
      h('div', { style: 'height:14px' }),
      h('div', { class: 'field' }, h('label', { for: 'petNameIn', text: t('start.name') }), name),
      h('div', { class: 'field' }, h('label', { for: 'ownerIn', text: t('start.owner') }), owner),
      go, h('p', { class: 'hint', style: 'margin:12px 0 0', text: t('start.sound') })));
    this.animate(hero, () => {
      const c = hero.getContext('2d'); c.clearRect(0, 0, 400, 340);
      drawEgg(c, this.egg, 200, 318, 2.3, this.t, 0.25 + 0.25 * Math.sin(this.t * 1.3), 0, false, this.clan);
    });
  },
  animate(cv, fn) {
    let last = performance.now();
    const loop = (ts) => { this.t += Math.min(0.05, (ts - last) / 1000); last = ts; if (!$('#start').hidden) { fn(); this.raf = requestAnimationFrame(loop); } };
    this.raf = requestAnimationFrame(loop);
  },
  begin(isNew) {
    Sound.ensure(); Sound.setSettings(S.settings);
    this.hide();
    Stage.pet.x = Stage.W / 2; Stage.pet.tx = Stage.pet.x;
    UI.applyLang(); UI.refresh();
    Stage.start(); Game.start();
    Net.updatePresence();
    Sound.play('friend');
    if (S.pet.stage === 0) { UI.tick(t('hatchHint'), '🥚'); }
    else {
      if (Boot.awayText) UI.tick(Boot.awayText, '🏡'); else UI.tick(t('tick.hello'), '👋');
      setTimeout(() => Game.say('hello'), 500);
      Stage.hop(220);
    }
    Boot.awayText = '';
    if (!isNew && Game.canEvolve()) setTimeout(() => UI.tick(t('evo.ready'), '✨'), 3500);
  },
};

/* =========================================================
   Boot
   ========================================================= */
const Boot = {
  awayText: '',
  run() {
    const loaded = loadState();
    S = loaded || newState(defaultSettings());
    LANG = S.settings.lang;
    applyTheme();
    Sound.setSettings(S.settings);
    UI.init();
    Stage.init();
    Battle.init();
    if (S.pet) {
      const away = (nowMs() - (S.lastSave || nowMs())) / 1000;
      if (away > 120 && S.pet.stage > 0) {
        Game.offline(away);
        const txt = away >= 3600 ? t('ago.h', { n: Math.floor(away / 3600) }) : t('ago.m', { n: Math.floor(away / 60) });
        this.awayText = t('tick.away', { t: txt });
      }
    }
    Start.show();
    Net.init().catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { saveNow(); Sound.suspend(); }
      else { Sound.resume(); Game.tick(); }
    });
    window.addEventListener('pagehide', saveNow);
    // unlock audio on first interaction anywhere
    const unlock = () => { Sound.ensure(); Sound.setSettings(S.settings); window.removeEventListener('pointerdown', unlock, true); window.removeEventListener('keydown', unlock, true); };
    window.addEventListener('pointerdown', unlock, true);
    window.addEventListener('keydown', unlock, true);
  },
};
Boot.run();
</script>
</body>
</html>
